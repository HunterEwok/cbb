# OSV-Scanner: advisories in the firmware's crates that CI's advisories job lets
# pass, each with the reason and a date to look again. It sits beside Cargo.lock
# because OSV-Scanner, and Scorecard's run of it, read the file next to each lockfile.
# Reference: https://google.github.io/osv-scanner/configuration/

# Both come in with esp-hal, pinned to a git commit for the Nano ESP32 firmware
# (esp32/), and run only at build time on the build machine: paste is a
# proc macro, unsafe-libyaml reads esp-config's YAML in build scripts. Both are
# unmaintained, not vulnerable; they go when esp-hal drops them.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-04-25T00:00:00Z
reason = "paste is unmaintained; a proc macro of esp-hal, build time only"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
ignoreUntil = 2027-04-25T00:00:00Z
reason = "unsafe-libyaml is unmaintained; esp-config's build scripts read YAML with it, build time only"

# crypto-bigint before 0.7.6 has branches that depend on secrets in operations
# meant to be constant-time. The 0.5 line comes with p256 0.13 through
# trouble-host (0.7 and 0.8 alike), which needs it for LE Secure Connections
# when the Nano ESP32 pairs as a Bluetooth keyboard (esp32/src/ble.rs);
# a HID host does not take a keyboard without pairing. The key is a fresh
# ECDH key of one pairing, made on the board only while the user lets it pair
# (ble pair), and a timing attack would have to measure the ESP32 from the
# air. The owner accepted it until trouble-host moves to p256 0.14.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-01-27T00:00:00Z
reason = "crypto-bigint 0.5 through trouble-host's p256 0.13, the Nano's Bluetooth pairing only"
