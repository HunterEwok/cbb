# The copyright and license of every file, machine-readable
# (https://reuse.software, checked by `reuse lint` in CI's check job). A file
# that names its own license and copyright keeps them; this file fills in
# what a file cannot carry itself, such as an image, a JSON file or a
# translation. The license texts are in LICENSES/.
version = 1

# Everything is the maintainer's, under the AGPL, unless a file says
# otherwise (protocol.md is under CC BY 4.0) or an annotation below does.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 HunterEwok"
SPDX-License-Identifier = "AGPL-3.0-only"

# Code copied from other projects, each under its own license (CONTRIBUTING,
# "Copied code"); the maintainer's changes are listed in each README.
[[annotations]]
path = ["internal/third_party/cpace/**", "core/src/third_party/cpace/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Go Authors", "2026 HunterEwok"]
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["internal/third_party/amneziawg-go/**", "internal/third_party/netstack/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2017-2025 WireGuard LLC", "The amneziawg-go authors", "2026 HunterEwok"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "member/src/third_party/pcsclite/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2019 Guillaume Ballet", "2026 HunterEwok"]
SPDX-License-Identifier = "BSD-3-Clause"

# Gradle's wrapper, as Gradle generates it.
[[annotations]]
path = ["apps/android/gradlew", "apps/android/gradlew.bat", "apps/android/gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "2015-2021 the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# The website's fonts, under the SIL Open Font License; each OFL-*.txt beside
# them names its font's authors.
[[annotations]]
path = "site/static/fonts/caveat-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2014 The Caveat Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/static/fonts/forum-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2011 Denis Masharov"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/static/fonts/ibm-plex-mono-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/static/fonts/jost-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Jost Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/static/fonts/OFL-*.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2014 The Caveat Project Authors", "2011 Denis Masharov", "2017 IBM Corp.", "2020 The Jost Project Authors"]
SPDX-License-Identifier = "OFL-1.1"
