# The Mac app's Xcode project, for XcodeGen: cd apps/macos && xcodegen generate.
# The generated CBBMac.xcodeproj and Info.plist are not committed.
name: CBBMac
options:
  bundleIdPrefix: tools.cbb
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  CBBMac:
    type: application
    platform: macOS
    sources:
      - CBBMac
      # The phone's colours and glass.
      - ../ios/CBB/Theme
      # The arrangement of the tiles, the same model as the phone's.
      - ../ios/CBBKit/Sources/CBBKit/Arrangement.swift
    info:
      path: CBBMac/Info.plist
      properties:
        CFBundleName: CBB
        CFBundleDisplayName: CBB
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, es, ru, ar, sw, he, hi]
        LSApplicationCategoryType: public.app-category.utilities
        # Lives in the menu bar only, as the tray app on Windows and Linux:
        # no Dock icon; the window opens from the menu.
        LSUIElement: true
        # The type of a dragged tile, which stays in the app (Views/Arrange.swift).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tools.cbb.mac.tile
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.cbb.mac
        PRODUCT_NAME: CBB
        # Drawn by tools/icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app talks to the service's control socket and runs cbb, which the
        # App Sandbox does not allow; the Developer ID app (roadmap item 22)
        # carries the service itself.
        ENABLE_APP_SANDBOX: NO
      configs:
        # Notarization needs it; debug builds go without, so that the tests
        # load into the app signed ad hoc.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CBBMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CBBMacTests
    dependencies:
      - target: CBBMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen names the host after the target; the app's product is CBB.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CBB.app/Contents/MacOS/CBB
        BUNDLE_LOADER: $(TEST_HOST)
  # The window driven as a person would (XCUITest).
  CBBMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - CBBMacUITests
      # The app's texts, to look up what the window shows in each language.
      - path: CBBMac/Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: CBBMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CBBMac
        # The tests' own strings stay out of the app's catalog.
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  CBBMac:
    build:
      targets:
        CBBMac: all
    test:
      targets:
        - CBBMacTests
        - CBBMacUITests
