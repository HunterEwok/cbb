# The cargo fuzz targets of the protocol core: the readers of
# what comes from the network. Nightly CI runs them (.github/workflows/nightly.yml):
#   cargo +nightly fuzz run record_body -- -max_total_time=60
[package]
name = "cbb-core-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cbb-core = { path = "..", features = ["std", "fuzzing"] }
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "pkcs8"] }

# Not a member of the top workspace.
[workspace]
members = ["."]

[[bin]]
name = "record_body"
path = "fuzz_targets/record_body.rs"
test = false
doc = false
bench = false

