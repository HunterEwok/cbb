# bug.cbb.tools: the apps post their sealed bug reports here
# (docs/core-api.md, "Bug reports"), and nginx passes them to cbb-bug on a
# loopback port (cbb-bug.service). A server block of its own: no client
# address in any log (cbb-bug gets only its prefix, for the day's shares),
# its own limits and certificate. The body limit is twice the largest report
# an app builds; cbb-bug's test
# nginx_takes_twice_the_largest_report checks the number below.
# One limit for each IPv4 address and each IPv6 /64, which one home or
# one server usually has whole. An address whose zeros are shortened within
# its first four groups counts by what comes before "::", a wider prefix.
map $remote_addr $cbb_bug_client {
    "~^(?<z>[0-9a-fA-F]*(:[0-9a-fA-F]+){0,2})::" $z::;
    "~^(?<p>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" $p;
    default $remote_addr;
}
limit_req_zone $cbb_bug_client zone=cbb_bug:1m rate=6r/m;
# The same for an IPv6 /48: cbb-bug gives each /64 and each /48 a share of
# the day's reports, counted in memory only.
map $remote_addr $cbb_bug_wide {
    "~^(?<z>[0-9a-fA-F]*(:[0-9a-fA-F]+){0,1})::" $z::;
    "~^(?<p>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" $p;
    default $remote_addr;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bug.cbb.tools;

    ssl_certificate /etc/letsencrypt/live/bug.cbb.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bug.cbb.tools/privkey.pem;

    access_log off;
    error_log /var/log/nginx/cbb-bug-error.log crit;

    client_max_body_size 440960;
    client_body_timeout 20s;

    location = / {
        limit_except POST { deny all; }
        limit_req zone=cbb_bug burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host bug.cbb.tools;
        proxy_set_header Connection "";
        proxy_set_header X-CBB-Source $cbb_bug_client;
        proxy_set_header X-CBB-Source-Wide $cbb_bug_wide;
        proxy_request_buffering on;
    }

    location / {
        return 404;
    }
}
