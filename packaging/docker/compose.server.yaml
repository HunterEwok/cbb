# A forwarder (cbb forward) on a server with a public address, for hubs that
# clients cannot reach directly. It holds no keys of any group; its own key
# and a table of hashed tags (forward-state.json) stay in the volume, and it
# prints the key at start:
#
#   docker compose -f compose.server.yaml up -d
#   docker compose -f compose.server.yaml exec forward cbb forward -show-key
#
# For a blind relay of your own groups instead, change the command to
# ["relay", "-group", "TAG", "-listen", ":8764"] (cbb status shows a group's tag).
services:
  forward:
    image: ghcr.io/hunterewok/cbb:latest # pin a release by its digest
    command: ["forward", "-listen", ":8764"]
    # With VLESS behind the host's web server: add "-vless-xhttp", "vpn.example.org",
    # "-vless-listen", ":3276" and publish "127.0.0.1:3276:3276/tcp" for it
    # (docs/admin/self-hosting.md, "VLESS on the forwarder").
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "8764:8764/udp"
      - "8764:8764/tcp"
    volumes:
      - state:/var/lib/cbb

volumes:
  state:
