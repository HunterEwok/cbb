# OSV-Scanner: advisories in cbb's crates (Cargo.lock) that CI's advisories job
# lets pass, each with the reason and a date to look again. It sits beside
# Cargo.lock because OSV-Scanner, and Scorecard's run of it, read the file next
# to each lockfile; esp32/osv-scanner.toml is the firmware's.
# Reference: https://google.github.io/osv-scanner/configuration/

# block-buffer before 0.12.1 can be left with a bad cursor when the compression
# callback panics and the caller catches the panic and uses the buffer again.
# Nothing here can catch one: cbb's release build aborts on a panic
# (Cargo.toml). The 0.10 line comes with digest 0.10 through GotaTun (blake2,
# hmac); it goes when GotaTun moves to digest 0.11, which carries 0.12.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-27T00:00:00Z
reason = "block-buffer 0.10 through GotaTun; panics abort, nothing catches one"
