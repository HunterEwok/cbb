[package]
name = "cbb-member"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "cbb, the member of a group on computers and small devices"
publish = false

[lib]
name = "cbb_member"
path = "src/lib.rs"

[[bin]]
name = "cbb"
path = "src/main.rs"

# The receiver of bug reports at bug.cbb.tools (src/bugd.rs).
[[bin]]
name = "cbb-bug"
path = "src/bug_main.rs"
required-features = ["tunnel"]

# The blind relay, a service of its own (src/relayd).
[[bin]]
name = "cbb-relay"
path = "src/relay_main.rs"
required-features = ["tunnel"]

# cbbw.exe, the same program without a console window, which Windows starts
# at sign-in for the agent (packaging/windows/install.ps1).
[[bin]]
name = "cbbw"
path = "src/windowless.rs"
required-features = ["windowless"]

[features]
default = ["tunnel"]
# Builds cbbw as well; for Windows.
windowless = []
# The bench's time-scaled build (src/benchtime.rs), never a release's.
benchtime = ["cbb-core/benchtime"]
# fuzzing opens the service's readers of outside input to the cargo fuzz
# targets in fuzz/ (src/fuzzing.rs).
fuzzing = []
# Sync away from home. GotaTun needs 64-bit atomics, which 32-bit MIPS lacks,
# so the MIPS builds leave it out (docs/roadmap.md, item 37).
tunnel = ["cbb-core/web", "dep:rustls", "dep:gotatun", "dep:bytes", "dep:smoltcp", "dep:blake2", "dep:chacha20", "dep:chacha20poly1305"]

[dependencies]
cbb-core = { path = "../core", features = ["std", "tls"] }
if-addrs = "0.15.0"
# libc 0.2.190 made SYSPROTO_CONTROL and UTUN_OPT_IFNAME macOS-only, which
# nix 0.31.3 (under GotaTun) still uses on iOS: Cargo.lock keeps 0.2.189 until
# a nix release follows.
libc = "0.2.189"
# mdns-sd's debug log, written to the file CBB_MDNS_TRACE names in tests
# (src/discovery.rs, trace).
log = "0.4.34"
mdns-sd = "0.21.6"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The group's images for the ZX Spectrum Next (src/nextimage.rs): PNG and
# JPEG, in pure Rust.
png = "0.18.1"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
# Keys in a Mac's Secure Enclave (src/sekey.rs): checking the enclave's
# signatures and sealing secrets as Go's internal/sekey does.
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "ecdh"] }
hkdf = "0.13"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# WireGuard for sync away from home: GotaTun's noise protocol, sans I/O, with
# the ring stand-in below; smoltcp is the TCP inside the tunnel.
gotatun = { version = "0.10.2", default-features = false, features = ["ring"], optional = true }
bytes = { version = "1", optional = true }
getrandom = { version = "0.4", features = ["std"] }
# AmneziaWG around GotaTun's messages (src/awg.rs), with the crates GotaTun
# already brings.
blake2 = { version = "0.11.0", optional = true }
chacha20 = { version = "0.10.2", optional = true }
hmac = "0.13"
chacha20poly1305 = { version = "0.11.0", optional = true }
base64 = "0.23.1"
# The way over VLESS (src/vless.rs): rustls with the core's provider, and
# its standard library's connections and system time.
rustls = { version = "0.23.46", default-features = false, features = ["std"], optional = true }
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"], optional = true }

# AF_UNIX sockets, the socket's access list, the process's user and the
# service's control on Windows (src/sys).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_NetManagement", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Windows Hello, which confirms an admin action (src/confirm.rs).
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Security_Cryptography_Core", "Storage_Streams"] }

[dev-dependencies]
# Signs the releases the update tests check.
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "pkcs8"] }
