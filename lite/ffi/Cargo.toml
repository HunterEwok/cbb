[package]
name = "cbb-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "The Rust core's entry point as C functions, for Go and the phone apps"
publish = false

[lib]
name = "cbb_ffi"
# staticlib for the iPhone and the Swift kit's tests, cdylib for Android and
# the Kotlin kit's tests (through JNA), lib for the Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# join: a phone that joins by its QR code with a key the core does not hold
# (src/join.rs), on the core's TLS; only the Aurora app's build takes it.
join = ["cbb-core/tls", "dep:qrcode", "dep:serde", "dep:serde_json"]

[dependencies]
cbb-core = { path = "../core", features = ["std"] }
qrcode = { version = "0.14.1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
# The example join-on-linux's software key and its answers' bytes.
base64 = "0.23"
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "pkcs8"] }

[[example]]
name = "join-on-linux"
required-features = ["join"]
