#
# The website on cbb.tools: /etc/nginx/conf.d/cbb.tools.conf. nginx from
# nginx.org with its ACME module gets and renews the certificates by itself
# (site/README.md). The forwarder and the relay keep their own ports.
#
# No access log: the site promises that it keeps no log of visits
# (site/templates/privacy.html). The error log keeps only what stops nginx.

resolver 127.0.0.53;

acme_issuer letsencrypt {
    uri        https://acme-v02.api.letsencrypt.org/directory;
    state_path /var/cache/nginx/acme-letsencrypt;
    accept_terms_of_service;
}
acme_shared_zone zone=acme_shared:1M;

# TLS 1.2 and 1.3 with forward-secret AEAD ciphers only (Mozilla's
# "intermediate"), no session tickets. nginx.org's nginx.conf sets none of
# these, so they hold for every server here.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:cbb_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

access_log off;
error_log /var/log/nginx/error.log crit;
server_tokens off;

# Closed until launch: everyone sees /soon.html, except a browser that
# opened /preview?key=SECRET and so holds the cookie cbb_preview=SECRET.
# /etc/nginx/cbb-preview.conf keeps the secret out of this file
# (site/README.md, "Closed until launch"); it sets $cbb_closed:
#
#     map $cookie_cbb_preview $cbb_closed { default 1; "SECRET" 0; }
#
# and at the launch becomes "map $cookie_cbb_preview $cbb_closed { default 0; }".
include /etc/nginx/cbb-preview.conf;
# /preview takes a few tries a minute from an address, so the key cannot
# be guessed online.
limit_req_zone $binary_remote_addr zone=cbb_preview:1m rate=6r/m;
# The cookie /preview sets, only for a key of 16 to 128 letters, digits, -
# and _, so that a link cannot add attributes to it; none otherwise (nginx
# sends no header with an empty value).
map $arg_key $cbb_preview_cookie {
    "~^[A-Za-z0-9_-]{16,128}$" "cbb_preview=$arg_key; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax";
    default "";
}

# What stays open while the site is closed: the closed page and its
# styles, the revocation mirror and the release channel the apps read, the
# counter, /preview.
map "$cbb_closed$cbb_vless:$uri" $cbb_soon {
    default 0;
    "~^10:/(?!static/|attest/|channel/|count|preview$|soon\.html$|\.well-known/|site\.webmanifest$)" 1;
}

# The forwarder's VLESS over XHTTP (cbb forward -vless-xhttp cbb.tools,
# docs/admin/self-hosting.md): one path, made at random on the server,
# passed to the forwarder on the loopback address. The path stays out of
# this file: /etc/nginx/cbb-vless-path.conf holds the line
#
#     "~^/PATH(/|$)" 1;
#
# and /etc/nginx/cbb-vless-location.conf the location (site/README.md,
# "VLESS"). Without them nothing is passed.
map $uri $cbb_vless {
    default 0;
    include /etc/nginx/cbb-vless-path*.conf;
}
upstream cbb_vless {
    server 127.0.0.1:3276;
}
# What a stranger, with no VLESS user yet, makes the forwarder hold
# (docs/relay-budget.md, "XHTTP"): XHTTP queues uploads before it knows
# the user, and behind this server every request comes from the loopback
# address, so only nginx can count them by their source. The location
# (site/README.md, "VLESS") takes uploads of at most 32 KiB, as the
# forwarder's MaxPostBytes, and these requests and connections.
limit_req_zone $binary_remote_addr zone=cbb_vless_addr:10m rate=150r/s;
limit_conn_zone $binary_remote_addr zone=cbb_vless_conn:10m;
limit_conn_zone $server_name zone=cbb_vless_all:1m;
map $cbb_closed $cbb_robots {
    1 "noindex";
    default "";
}

# The language of a page's path, for its error page: /ru/x gives ru.
map $uri $site_lang {
    "~^/(?<l>ru|zh|es|ar|sw|he|hi)/" $l;
    default en;
}

# The language chooser (tools/site serve).
upstream cbb_site {
    server 127.0.0.1:8780;
}

# The visit counter (GoatCounter, deploy/cbb-site-stats.service).
upstream cbb_stats {
    server 127.0.0.1:8781;
}

# Port 80 answers the ACME challenges, which the module takes by itself, and
# sends everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cbb.tools www.cbb.tools;
    location / {
        return 301 https://cbb.tools$request_uri;
    }
    # The ZX Spectrum Next's files, which NextZXOS's .http fetches without
    # TLS (docs/maintaining.md, "The ZX Spectrum Next's files"):
    # /srv/cbb.tools/zxnext, kept by cbb-mirror.timer from checked releases.
    location = /zxnext {
        alias /srv/cbb.tools/zxnext/CBB;
        default_type application/octet-stream;
    }
    location /zxnext/ {
        root /srv/cbb.tools;
        default_type application/octet-stream;
    }
}

# The mirror of the releases (docs/maintaining.md, "The mirror"), on a name
# of its own: /srv/dl.cbb.tools, kept by cbb-mirror.timer. Devices check
# every file's signature, so it is plain files and nothing else.
server {
    listen 80;
    listen [::]:80;
    server_name dl.cbb.tools;
    location / {
        return 301 https://dl.cbb.tools$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dl.cbb.tools;
    acme_certificate letsencrypt;
    ssl_certificate       $acme_certificate;
    ssl_certificate_key   $acme_certificate_key;
    ssl_certificate_cache max=2;

    root /srv/dl.cbb.tools;
    autoindex off;
    default_type application/octet-stream;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # keys.json and the channel file change while a release is current.
    location ~ "^/[a-z][a-z0-9-]*\.json$" {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }
    # A release's files never change.
    location ~ "^/v[0-9][^/]*/[^/.][^/]*$" {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        expires max;
    }
    location / {
        return 404;
    }
}

# HTTP/2 and HTTP/1.1 on TCP 443. No HTTP/3: UDP 443 on this server is left to
# other services, and a site this small gains little from QUIC.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cbb.tools;
    acme_certificate letsencrypt;
    ssl_certificate       $acme_certificate;
    ssl_certificate_key   $acme_certificate_key;
    ssl_certificate_cache max=2;
    return 301 https://cbb.tools$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cbb.tools;
    acme_certificate letsencrypt;
    ssl_certificate       $acme_certificate;
    ssl_certificate_key   $acme_certificate_key;
    ssl_certificate_cache max=2;

    root /srv/cbb.tools/www;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Robots-Tag $cbb_robots always;

    if ($cbb_soon) {
        rewrite ^ /soon.html last;
    }
    include /etc/nginx/cbb-vless-location*.conf;
    # Opens the closed site in this browser for a year; a wrong key leaves
    # it closed. The redirect comes after the rate limit: a return here
    # would answer before it.
    location = /preview {
        limit_req zone=cbb_preview burst=5 nodelay;
        limit_req_status 429;
        try_files /.cbb-preview-none @preview;
    }
    location @preview {
        add_header Set-Cookie $cbb_preview_cookie always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # "/" picks the visitor's language; while the chooser is down, English.
    location = / {
        proxy_pass http://cbb_site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @english;
    }
    location @english {
        return 302 /en/;
    }

    # The visit counter: its script and what it sends. GoatCounter knows the
    # site by the name "stats.localhost", which its dashboard uses through an
    # SSH tunnel; it gets the visitor's address only to count them, and keeps
    # it nowhere.
    location = /count.js {
        proxy_pass http://cbb_stats;
        proxy_set_header Host stats.localhost;
        expires 1d;
    }
    location = /count {
        proxy_pass http://cbb_stats;
        proxy_set_header Host stats.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # build writes a .gz beside each text file; browsers that take gzip get
    # it as it is, the others the plain file.
    gzip_static on;

    location /static/ {
        expires 7d;
    }
    # The names of the stylesheet and the script carry a hash of their
    # contents: a new version is a new name, so these can be kept for good.
    location ~ "^/static/(style\.[0-9a-f]{8}\.css|site\.[0-9a-f]{8}\.js)$" {
        expires max;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # The mirror of Google's revocation list (docs/maintaining.md, "The
    # status key"): /srv/cbb.tools/attest.
    location /attest/ {
        root /srv/cbb.tools;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # The release channel's keys.json and stable.json, renewed weekly by
    # cbb-channel.timer (docs/maintaining.md, "Signed releases"):
    # /srv/cbb.tools/channel, outside www so that a deploy leaves it alone.
    location /channel/ {
        root /srv/cbb.tools;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # The error pages in the page's language (tools/site build writes
    # them). What went wrong is in the error log, without the visitor.
    error_page 404 /$site_lang/404.html;
    error_page 500 502 503 504 /$site_lang/50x.html;
}
