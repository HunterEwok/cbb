# Installs Debian packages with apt and keeps the downloaded .deb files in the
# Actions cache. When the Ubuntu mirrors cannot be reached (a DNS outage of the
# runners has failed every job that installs a package), the job installs the
# copies from the cache instead of failing before its first test.
#
# The cache key names the job's packages, the runner image and a hash of the .deb files, so a new
# cache is saved only when the packages change. A pull request restores the
# caches its own branch saved and those of main.
#
# The workflows call it as ./.github/actions/apt, the path every checkout of
# this repository has, with zizmor's self-repository rule ignored on that line
# as release.yml does for its own workflow.
name: apt packages
description: Installs Debian packages with apt, with the downloaded files kept in the Actions cache.
inputs:
  packages:
    description: The packages, separated by spaces.
    required: true
  cache:
    description: A name for this job's packages in the cache key.
    required: true
  no-recommends:
    description: '"true" installs without the packages they recommend.'
    default: "false"
runs:
  using: composite
  steps:
    # The runner image's name and version tell its package lists apart.
    - id: prefix
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
      run: echo "key=apt-$CACHE-$RUNNER_OS-$RUNNER_ARCH-${ImageOS:-image}-" >>"$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-debs
        key: ${{ steps.prefix.outputs.key }}none
        restore-keys: ${{ steps.prefix.outputs.key }}
    - id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-recommends }}
        KEY_PREFIX: ${{ steps.prefix.outputs.key }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
    - if: steps.install.outputs.key != '' && steps.install.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-debs
        key: ${{ steps.install.outputs.key }}
