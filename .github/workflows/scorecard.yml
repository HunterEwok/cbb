# SPDX-License-Identifier: AGPL-3.0-only
# OpenSSF Scorecard: an outside measure of how the repository is kept (pinned
# actions, branch protection, reviews, the workflows' permissions, signed
# releases, fuzzing, and more). Its findings go to Code scanning, beside
# CodeQL's, and the score is published at securityscorecards.dev for the
# README's badge. It only reads the repository.
name: scorecard

on:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The findings to Code scanning, and the published score, which the
      # scorecard API accepts only with the workflow's OIDC token.
      security-events: write
      id-token: write
      # To wait for android-wrapper's run below.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Binary-Artifacts lets gradle-wrapper.jar pass only when
      # android-wrapper.yml, which checks the jar, has a successful run on
      # this commit; a push to main starts both workflows at once, so this
      # one waits for that run to end first, five minutes at most.
      - name: wait for android-wrapper's check of the Gradle wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow android-wrapper.yml --commit "$GITHUB_SHA" \
              --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            echo "android-wrapper on $GITHUB_SHA: ${state:-no run yet}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::warning::android-wrapper did not pass on this commit"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::warning::android-wrapper has not finished on this commit after five minutes"
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
