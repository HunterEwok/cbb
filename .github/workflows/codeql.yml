# SPDX-License-Identifier: AGPL-3.0-only
# CodeQL code scanning (advanced setup) for every language in the repository.
#
# GitHub's default setup cannot build the Android app: it tries Java/Kotlin without a build,
# which finds nothing in a Kotlin project and fails. Here Kotlin is built with Gradle, and the
# other languages run as the default setup ran them. Swift has its own workflow,
# codeql-swift.yml, since its analysis takes about 45 minutes. The default setup must stay off
# (Settings → Advanced Security → CodeQL analysis), or GitHub rejects these results.
#
# Not required by the ruleset of main (only ci's "ci-ok" is). Alerts show under Security →
# Code scanning.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, for new queries on unchanged code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }}${{ matrix.os && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: go
            build-mode: autobuild
            runner: ubuntu-latest
          # Go checks only the files of the system it builds for, so the files for Windows
          # and macOS alone (remote paste, the control socket's access list, the keychain)
          # are analyzed on their own runners, each with a category of its own. On pull
          # requests the macOS files are analyzed by ci.yml's macOS job, which builds Go
          # on macOS anyway (macOS runners are few); here only on main and weekly
          # (analyze-macos below).
          - language: go
            build-mode: autobuild
            runner: windows-latest
            os: windows
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: matrix.build-mode == 'autobuild'
      - name: Gradle from the cache
        id: gradle
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle, its download tried three times when it is not in the cache
        if: matrix.language == 'java-kotlin' && steps.gradle.outputs.cache-hit != 'true'
        working-directory: apps/android
        run: for _ in 1 2 3; do ./gradlew --no-daemon -q --version >/dev/null && exit 0; sleep 30; done; exit 1
      - name: Gradle's dependencies from the cache
        # Maven Central refuses a runner that asks it too often (status 429),
        # as in ci.yml's Android jobs; what this job fetched before comes from here.
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: gradle-deps-${{ runner.os }}-codeql-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle.properties', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-${{ runner.os }}-codeql-
      - name: build the Android apps and the kit
        if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        # CodeQL sees only what is compiled while it watches, so no daemon, no build cache
        # and the Kotlin compiler inside Gradle's process. The runner image has the Android SDK.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n "s/^cbb.ndk=//p" gradle.properties)" >/dev/null </dev/null
          # The Rust the core's libraries are built with (ffi/), and cargo-ndk.
          rustup toolchain install "$(sed -n 's/^cbb.rust=//p' gradle.properties)" --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cargo install --locked cargo-ndk@4.1.2
          ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process \
            :app:assembleDebug :app:compileFullDebugUnitTestKotlin :app:compileFdroidDebugUnitTestKotlin :wear:assembleDebug
          ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process \
            -p kit testClasses
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}${{ matrix.os && format('/{0}', matrix.os) || '' }}

  macos-changed:
    # Whether a push to main changed what only macOS builds of the Go code compile:
    # the files for darwin (and the BSDs, which macOS is built as), the module's
    # dependencies, or this workflow. Only then does the push take a macOS runner
    # for analyze-macos: the pull request had the same code analyzed in ci.yml's
    # macOS job already, and macOS runners are few. The weekly run and a run by
    # hand always analyze, and keep main's alerts for macOS current.
    name: macOS's own Go changed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.files.outputs.changed }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A first push, or a comparison GitHub cannot give: analyze.
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>/dev/null) || [ -z "$files" ]; then
            echo changed=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$files" | grep -qE '_(darwin|bsd)(_test)?\.go$|^internal/third_party/amneziawg-go/tun/operateonfd\.go$|^internal/pasteboard/[a-z_]*_test\.go$|^go\.(mod|sum)$|^\.github/workflows/codeql\.yml$'; then
            echo changed=true >>"$GITHUB_OUTPUT"
          else
            echo changed=false >>"$GITHUB_OUTPUT"
          fi

  analyze-macos:
    # The Go files for macOS alone, as the matrix above analyzes Windows's. On pull
    # requests ci.yml's job "test and build (macOS), homebrew, Mac app" runs these
    # same steps under the same category, so a pull request takes no macOS runner
    # of its own for them; on a push to main, only when macos-changed says so.
    name: analyze (go, macos)
    needs: macos-changed
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'push' || needs.macos-changed.outputs.changed == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go/macos
