# SPDX-License-Identifier: AGPL-3.0-only
# CodeQL code scanning of the iPhone app and its kit (Swift).
#
# Apart from codeql.yml because it is slow: CodeQL's Swift tracer makes the build of the app
# take about half an hour. So it runs when something under apps/ios changes (on pull requests
# from ci.yml, after the iPhone app's jobs, so it never holds one of the few macOS runners
# they wait for), weekly for new queries on unchanged code, by hand (Actions → codeql-swift
# → Run workflow), and for each release: release.yml calls it and publishes only if it
# passes.
#
# GitHub's default setup builds only the kit's package, not the app, since the app's Xcode
# project is generated by xcodegen. Building the app compiles the kit too.
#
# Not required by the ruleset of main. Alerts show under Security → Code scanning.
name: codeql-swift

on:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - .github/workflows/codeql-swift.yml
  schedule:
    - cron: "17 4 * * 1" # weekly
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a pull request, the iPhone app's jobs have just saved this Rust build
      # (ci.yml); a release builds from nothing.
      - name: the Rust build from this pull request's cache
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/rust-cache # zizmor: ignore[self-repository]
        with:
          name: ios-sim
      - name: generate the iPhone app's project and fetch its packages
        # Before CodeQL watches: Homebrew refuses to run under its tracer. The app
        # links the Rust core (ffi/), with the phones' tunnel, which Rust builds:
        # only the simulator's library for this Mac's processor, the one the
        # build below links.
        run: |
          sh ffi/bind.sh ios-sim apps/ios/CbbCore
          brew install xcodegen
          (cd apps/ios && xcodegen generate)
          xcodebuild -resolvePackageDependencies -project apps/ios/CBB.xcodeproj -scheme CBB
      - name: the Rust build into this pull request's cache
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/rust-cache # zizmor: ignore[self-repository]
        with:
          name: ios-sim
          save: "true"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      - name: build the iPhone app and the kit
        # Unsigned, for the simulator, and for this Mac's processor only: for any
        # simulator Xcode builds every Swift file twice, for arm64 and x86_64, and
        # the tracer extracts the same sources from both.
        run: |
          set -o pipefail
          xcodebuild build -project apps/ios/CBB.xcodeproj -scheme CBB \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO | tail -n 50
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
