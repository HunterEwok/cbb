# CI: checks, tests and cross builds for every pull request.
#
# The ruleset of main requires only the job "ci-ok", which passes when every other job passed,
# so jobs can be added or renamed without touching the ruleset.
# It does not run again on main: the ruleset merges only by squashing a pull request that is
# up to date with main, so main always holds the tree its pull request's run tested.
# Actions are pinned to commit SHAs; Dependabot updates them.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts the pull request changes (.github/ci-changes.sh); the jobs of
  # the other parts are skipped, and ci-ok counts them as passed.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.parts.outputs.core }}
      tools: ${{ steps.parts.outputs.tools }}
      rust: ${{ steps.parts.outputs.rust }}
      ios: ${{ steps.parts.outputs.ios }}
      macos: ${{ steps.parts.outputs.macos }}
      desktop: ${{ steps.parts.outputs.desktop }}
      android: ${{ steps.parts.outputs.android }}
      zxnext: ${{ steps.parts.outputs.zxnext }}
      silica: ${{ steps.parts.outputs.silica }}
      site: ${{ steps.parts.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the parts the pull request changes
        id: parts
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/ci-changes.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base of the pull request, for the tests it must keep.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: actionlint
        run: go tool actionlint
      - name: zizmor, the workflows' security
        # actionlint checks how the workflows are written; zizmor looks for holes in them:
        # a pull request's text run as a command, a token left where a step can take it,
        # wide permissions, a cache that a release could be built from, an action pinned
        # to a commit outside its repository. A finding it must leave alone carries a
        # `# zizmor: ignore[...]` comment that says why.
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --min-severity low --format github .github/workflows
      - name: repository rules, and every test of the base still there
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: go run ./tools/repocheck -tests-since "$BASE"
      - name: design tokens up to date and readable
        run: go run ./tools/tokens -check
      - name: app icon up to date
        run: go run ./tools/icon -check
      - name: website pages and translations
        run: go run ./tools/site check
      - name: shellcheck, every shell script
        run: sh .github/shellcheck.sh
      - name: typos, the spelling of the English text (_typos.toml)
        run: pipx run typos==1.51.1
      - name: Biome, the tray app's HTML, CSS and JavaScript (biome.json)
        run: npx --yes @biomejs/biome@2.6.2 ci
      - name: REUSE, every file's copyright and license (REUSE.toml, LICENSES/)
        run: pipx run reuse==6.2.0 lint

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The runner's Windows session has a clipboard that the tests may overwrite.
      CBB_TEST_CLIPBOARD: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: swtpm, a software TPM for the tests of keys in a TPM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q swtpm
          echo CBB_TPM_REQUIRED=1 >>"$GITHUB_ENV"
      - name: go test
        # bash: PowerShell splits -coverprofile=cover-go.out at the dot. Each
        # system's file has a name of its own: the coverage job downloads
        # them all into one folder. The service's tests take close to go
        # test's default 10 minutes under -race on the macOS runner, so the
        # package has 20.
        shell: bash
        run: go test -race -timeout 20m -coverprofile="cover-go-${{ matrix.os }}.out" ./...
      # The Rust service's own Windows parts: the control sockets' folders
      # and access lists.
      - name: cargo test of the Rust service's Windows parts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cargo test --locked -p cbb-member --lib sys::acl
      # int is 32 bits there, as on the Raspberry Pi's armv7, and 386 runs
      # on the runner without an emulator.
      - name: go test of the group and the copies on a 32-bit build
        if: matrix.os == 'ubuntu-latest'
        run: go test ./internal/group ./internal/clip ./internal/helper
        env:
          GOARCH: "386"
      # Each system's own files (Windows, macOS) for the coverage summary; the
      # coverage job measures across packages on Linux.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-${{ matrix.os }}
          path: cover-go-${{ matrix.os }}.out
          retention-days: 7

  # Go's test coverage across packages (a test of internal/service counts for
  # internal/group too), with the TPM, the desktop clipboards and the e2e's
  # programs built with -cover; the coverage job sums it up.
  gocover:
    name: go coverage
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERPKG: ./cmd/...,./internal/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: swtpm, sway, Xvfb and the clipboard tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends swtpm sway wl-clipboard xvfb xclip xterm foot >/dev/null
      - name: go test across packages
        env:
          CBB_TPM_REQUIRED: "1"
        run: go test -coverpkg="$COVERPKG" -coverprofile=cover-go-all.out ./cmd/... ./internal/...
      - name: the desktop clipboards under headless sway and Xvfb
        run: |
          go test -c -cover -coverpkg="$COVERPKG" -o "$RUNNER_TEMP/desktop.test" ./internal/desktop
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway >"$RUNNER_TEMP/sway.log" 2>&1 &
          # -noreset: Xvfb resets when its last client goes, and a test
          # that connects while it does fails.
          Xvfb :5 -screen 0 640x480x24 -noreset >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 100); do
            WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -n 1)
            [ -n "$WAYLAND_DISPLAY" ] && [ -e /tmp/.X11-unix/X5 ] && break
            sleep 0.1
          done
          export WAYLAND_DISPLAY DISPLAY=:5
          CBB_TEST_WAYLAND=1 CBB_TEST_X11=1 "$RUNNER_TEMP/desktop.test" -test.coverprofile=cover-go-desktop.out
      - name: the uinput keyboard against the kernel
        run: |
          go test -c -cover -coverpkg="$COVERPKG" -o "$RUNNER_TEMP/uinput.test" ./internal/uinput
          sudo modprobe uinput
          sudo CBB_TEST_UINPUT=1 "$RUNNER_TEMP/uinput.test" -test.run TestKeyboard -test.coverprofile="$PWD/cover-go-uinput.out"
          sudo chown "$(id -u)" cover-go-uinput.out
      - name: mDNS beside avahi-daemon in a container
        env:
          CGO_ENABLED: "0"
        run: |
          go test -c -cover -coverpkg="$COVERPKG" -o "$RUNNER_TEMP/mdns.test" ./internal/mdns
          mkdir -p "$RUNNER_TEMP/mdns-cover"
          docker run --rm -v "$RUNNER_TEMP/mdns.test:/t/mdns.test:ro" -v "$RUNNER_TEMP/mdns-cover:/out" debian:stable-slim sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq avahi-daemon avahi-utils dbus >/dev/null
            mkdir -p /run/dbus
            dbus-daemon --system --fork
            avahi-daemon --daemonize --no-chroot
            sleep 2
            CBB_TEST_AVAHI=1 /t/mdns.test -test.run "TestAvahi|TestSystemNetwork" -test.coverprofile=/out/cover.out
          '
          sudo cp "$RUNNER_TEMP/mdns-cover/cover.out" cover-go-mdns.out
          sudo chown "$(id -u)" cover-go-mdns.out
      - name: the e2e with the Rust cbb and a cbb-helper built with -cover
        env:
          CGO_ENABLED: "0"
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --release -p cbb-member
          mkdir -p "$RUNNER_TEMP/e2e"
          cp target/release/cbb "$RUNNER_TEMP/e2e/cbb"
          go build -trimpath -cover -coverpkg="$COVERPKG" -o "$RUNNER_TEMP/e2e/cbb-helper" ./cmd/cbb-helper
          CBB_E2E_COVERDIR="$RUNNER_TEMP/e2e-cover" sh tools/e2e/e2e.sh "$RUNNER_TEMP/e2e/cbb"
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/e2e-cover"
          go tool covdata textfmt -i "$RUNNER_TEMP/e2e-cover" -o cover-go-e2e.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-linux-all
          path: cover-go-*.out
          retention-days: 7

  # Sums up the coverage of every part that ran (docs/testing.md, "Coverage")
  # and fails when one falls below its floor in tools/coverage/floor.json,
  # or a hard gate fails: a closed audit finding whose test is gone, a
  # format rule no vector refuses.
  coverage:
    name: coverage
    needs: [changes, test, gocover, kit, android, rust, service]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: cov
          merge-multiple: true
      - name: the summary, and the floors
        run: |
          set --
          # Go is measured when the run across packages is there; the test
          # job alone (a change to tools/) does not measure the service.
          if [ -f cov/cover-go-all.out ]; then
            for f in cov/cover-go*.out; do set -- "$@" -go "$f"; done
          fi
          [ -f cov/coverage-rust.json ] && set -- "$@" -llvm rust-core=cov/coverage-rust.json -llvm rust-member=cov/coverage-rust.json
          [ -f cov/coverage-rust-service.json ] && set -- "$@" -llvm rust-service=cov/coverage-rust-service.json
          [ -f cov/coverage-swift-kit.json ] && set -- "$@" -llvm swift-kit=cov/coverage-swift-kit.json
          [ -f cov/jacocoTestReport.xml ] && set -- "$@" -jacoco kotlin-kit=cov/jacocoTestReport.xml
          go run ./tools/coverage -floor tools/coverage/floor.json -target 90 -branch-target 80 -core-branch-target 90 \
            -audit testdata/audit/closed.json -rules core/src -vectors testdata/format \
            -summary "$GITHUB_STEP_SUMMARY" "$@"

  build:
    name: build (${{ matrix.systems }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - systems: Linux
            targets: linux/amd64 linux/arm64 linux/arm/7 linux/arm/6
          - systems: FreeBSD, Windows
            targets: freebsd/amd64/vet freebsd/arm64 windows/amd64/vet windows/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: zig, which links cbb for FreeBSD and Windows, and the nightly Rust of FreeBSD's ARM64 build
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install -q ziglang==0.16.0 cargo-zigbuild==0.24.0
          echo "$RUNNER_TEMP/zig/bin" >>"$GITHUB_PATH"
      - name: cbb and the Go programs beside it, and the release archive of each target, as at a release
        # Two jobs, each building cbb (Rust, member/packaging/build.sh) and the
        # Go programs for its targets: Rust builds each target from the start.
        # go vet runs once per operating system: the code differs by system,
        # not by architecture, and the check job vets Linux. ARMv6 is for the
        # Raspberry Pi Zero W; the routers' MIPS builds are the rustmips job's.
        env:
          CGO_ENABLED: "0"
          TARGETS: ${{ matrix.targets }}
        run: |
          # shellcheck disable=SC2086 # the targets are words
          sh .github/build-targets.sh "$RUNNER_TEMP" $TARGETS
      - name: keep the Windows archive for the installer test
        if: contains(matrix.targets, 'windows/amd64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbb-windows-amd64.zip
          path: ${{ runner.temp }}/dist/cbb-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1
  buildmac:
    name: build (macOS)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # The Mac's pasteboard agent needs cgo, so the macOS targets are built on macOS.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: cbb, the Go programs beside it and the release archives, as at a release
        env:
          CGO_ENABLED: "1"
        run: sh .github/build-targets.sh "$RUNNER_TEMP" darwin/arm64/vet darwin/amd64
      - name: the agent's helper has the pasteboard
        # Without cgo the agent would start and fail; the helper must link AppKit.
        run: |
          for a in arm64 amd64; do
            otool -L "$RUNNER_TEMP/darwin-$a/cbb-helper" | grep -q AppKit.framework
          done
      - name: the programs run under the hardened runtime, as a release signs them (ad hoc here)
        run: |
          for a in arm64 amd64; do
            for f in cbb cbb-helper cbb-forward cbb-relay; do
              sh packaging/macos/sign.sh - "$RUNNER_TEMP/darwin-$a/$f"
            done
          done
          "$RUNNER_TEMP/darwin-arm64/cbb" version
  mips:
    name: test (linux/mips under qemu)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # Big-endian and 32-bit at once, as on many OpenWrt routers: the
    # strictest of the release targets, for byte order and 64-bit atomics.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOARCH: mips
      GOMIPS: softfloat
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: qemu for mips programs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user qemu-user-binfmt
      - name: go test the network and the group under qemu-mips
        run: >-
          go test -timeout 20m -exec "$(command -v qemu-mips-static || command -v qemu-mips)" ./internal/clip ./internal/control ./internal/group
          ./internal/hlc ./internal/mdns ./internal/netguard ./internal/openwrt
          ./internal/tunnel
          ./internal/vless </dev/null

  freebsd:
    name: test (freebsd)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: cbb for FreeBSD, linked with zig as the release links it, and cbb-helper beside it
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install -q ziglang==0.16.0 cargo-zigbuild==0.24.0
          export PATH="$RUNNER_TEMP/zig/bin:$PATH"
          rustup toolchain install stable --profile minimal
          dir=$(sh member/packaging/build.sh freebsd/amd64)
          mkdir -p freebsd-bin
          cp "$dir/cbb" freebsd-bin/cbb
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -trimpath -o freebsd-bin/cbb-helper ./cmd/cbb-helper
      - name: go test in a FreeBSD 15.1 virtual machine
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          # FreeBSD's go fetches the toolchain go.mod names; Xvfb, xclip
          # and xterm are for the desktop connector's X11 tests.
          prepare: pkg install -y go xorg-vfbserver xclip xterm
          run: |
            set -e
            export GOTOOLCHAIN=auto GOFLAGS=-buildvcs=false
            go version
            go test ./... </dev/null
            # The desktop connector against X11 under Xvfb, as on Linux.
            go test -c -o /tmp/desktop.test ./internal/desktop
            Xvfb :5 -screen 0 640x480x24 -noreset >/tmp/xvfb.log 2>&1 &
            # Its socket shows before it takes clients (TestX11 met EOF):
            # wait until xclip reaches it, with no selection to read yet.
            for _ in $(seq 1 100); do
              out=$(DISPLAY=:5 xclip -selection clipboard -o 2>&1 >/dev/null) || true
              case $out in *"open display"*) sleep 0.1 ;; *) break ;; esac
            done
            DISPLAY=:5 CBB_TEST_X11=1 /tmp/desktop.test -test.v
            # Port 5353 beside a responder of another user, as avahi runs:
            # FreeBSD shares it only with a socket root opened.
            go test -c -o /tmp/mdns.test ./internal/mdns
            CBB_TEST_MDNS_USERS=1 /tmp/mdns.test -test.run 'TestOtherUsers$' -test.v
            # The installer, the rc.d script and pf's anchor on the real system,
            # with the cbb and cbb-helper built for FreeBSD before.
            mkdir -p /tmp/cbbbin
            cp freebsd-bin/cbb freebsd-bin/cbb-helper /tmp/cbbbin/
            sh packaging/freebsd/install.sh --no-firewall /tmp/cbbbin/cbb
            service cbb status
            test -f /usr/local/etc/xdg/autostart/cbb-desktop.desktop
            # cbb opens its mDNS sockets as root, then runs as its user.
            sleep 2
            failed() {
              echo "$1" >&2
              ps -axwwo user,pid,ppid,command | grep '[c]bb' || true
              grep cbb /var/log/messages | tail -n 40 || true
              exit 1
            }
            # By the command's name: the full command lines include this
            # script's own shell, which names cbb service too.
            ps -ax -o user= -o comm= | grep -Eq '^cbb +cbb$' || failed "cbb service does not run as cbb"
            if ps -ax -o user= -o comm= | grep -Eq '^root +cbb$'; then failed "cbb service runs as root"; fi
            cbb status 2>&1 | grep -Eq 'in a group|no group' || failed "cbb status got no answer"
            kldload -n pf
            touch /etc/pf.conf
            pfctl -e
            sh /usr/local/share/cbb/firewall.sh open 8764
            pfctl -a cbb -s rules | grep -q 'port = 8764'
            sh /usr/local/share/cbb/firewall.sh hub-open 51820
            pfctl -a cbb -s rules | grep -q 'port = 51820'
            sh /usr/local/share/cbb/firewall.sh hub-close
            sh /usr/local/share/cbb/uninstall.sh --purge
            if grep -q cbb /etc/pf.conf; then exit 1; fi
            if pfctl -a cbb -s rules 2>/dev/null | grep -q pass; then exit 1; fi
            if [ -e /usr/local/bin/cbb ] || [ -e /var/db/cbb ]; then exit 1; fi
            if [ -e /usr/local/etc/xdg/autostart/cbb-desktop.desktop ]; then exit 1; fi
            # OPNsense, played by its version file and a configctl that loads a
            # ruleset naming the anchor, as the plugin hook makes OPNsense's.
            mkdir -p /usr/local/opnsense/version
            touch /usr/local/opnsense/version/core
            printf '#!/bin/sh\nprintf "anchor \\"cbb\\"\\npass all\\n" | pfctl -f -\n' >/usr/local/sbin/configctl
            chmod 0755 /usr/local/sbin/configctl
            cp /etc/pf.conf /tmp/pf.conf.before
            sh packaging/freebsd/install.sh --express /tmp/cbbbin/cbb
            test -f /usr/local/etc/inc/plugins.inc.d/cbb.inc
            test ! -e /usr/local/etc/xdg/autostart/cbb-desktop.desktop
            test "$(sh /usr/local/share/cbb/firewall.sh kind)" = opnsense
            pfctl -s rules | grep -q 'anchor "cbb"'
            pfctl -a cbb -s rules | grep -q 'port = 8764'
            cmp /etc/pf.conf /tmp/pf.conf.before
            sh /usr/local/share/cbb/uninstall.sh --purge
            test ! -e /usr/local/etc/inc/plugins.inc.d/cbb.inc
            if pfctl -a cbb -s rules 2>/dev/null | grep -q pass; then exit 1; fi
            cmp /etc/pf.conf /tmp/pf.conf.before
            rm -rf /usr/local/opnsense /usr/local/sbin/configctl
            # pfSense: nothing is changed, the rules to add are printed.
            echo pfSense >/etc/platform
            test "$(sh packaging/freebsd/firewall.sh kind)" = pfsense
            sh packaging/freebsd/firewall.sh commands 8764 | grep -q 'Firewall > Rules'
            sh packaging/freebsd/firewall.sh hub-commands 51820 | grep -q 'port 51820'
            sh packaging/freebsd/firewall.sh open 8764 2>&1 | grep -q 'nothing was added' || { echo "open changed pfSense's rules" >&2; exit 1; }
            rm -f /etc/platform
            # ipfw, with pf off; it lets everything else in, as this VM's
            # SSH needs.
            pfctl -d
            kenv net.inet.ip.fw.default_to_accept=1
            kldload -n ipfw
            sysctl net.inet.ip.fw.enable=1
            k=$(sh packaging/freebsd/firewall.sh kind)
            test "$k" = ipfw || { echo "firewall.sh found $k, not ipfw" >&2; kldstat; exit 1; }
            sh packaging/freebsd/firewall.sh open 8764
            sh packaging/freebsd/firewall.sh hub-open 51820
            ipfw list
            # ipfw shows "allow tcp ... in ip4" as "allow ip4 ... proto tcp in".
            ipfw list | grep -qE 'allow (tcp|ip4) from 192\.168\.0\.0/16 to me 8764( proto tcp)? in' || { echo "ipfw has no rule for the member port" >&2; exit 1; }
            ipfw list | grep -qE 'allow (udp|ip) from any to me 51820( proto udp)? in' || { echo "ipfw has no rule for the hub's port" >&2; exit 1; }
            sh packaging/freebsd/firewall.sh hub-close
            sh packaging/freebsd/firewall.sh close
            if ipfw list | grep -qE 'to me (8764|51820)'; then echo "ipfw kept the rules" >&2; ipfw list; exit 1; fi

  openwrt:
    name: OpenWrt
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the release archive (cbb with cbb-helper), as get.sh takes it
        run: |
          rel="$RUNNER_TEMP/release"
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          cargo +stable build --locked --release --target x86_64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/full"
          cp target/x86_64-unknown-linux-musl/release/cbb "$RUNNER_TEMP/full/cbb"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/full/cbb-helper" ./cmd/cbb-helper
          sh packaging/archive.sh "$RUNNER_TEMP/full/cbb" linux amd64 "$rel"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          # get.sh as the release publishes it, with its translations.
          sh packaging/l10n-embed.sh packaging/get.sh >"$rel/get.sh"
      - name: get.sh installs it in OpenWrt's root file system, with and without --no-helper, and uninstall.sh removes it
        run: sh tools/e2e/openwrt.sh rootfs "$RUNNER_TEMP/release"
      - name: the apk feed, signed with a test key, installs and removes it
        run: sh tools/e2e/openwrt.sh feed "$RUNNER_TEMP/release"
      - name: on OpenWrt booted in QEMU, the service, the hub's rule in fw4, the wait for NTP and get.sh --no-helper
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 sshpass
          sudo chmod 666 /dev/kvm
          sh tools/e2e/openwrt.sh vm "$RUNNER_TEMP/release"

  upgrade:
    name: upgrade from the last release
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the last published release, checked against its SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old"
          # The archives took the project's short name in 0.6, so the last release's
          # are found by their ending; those before 0.6 also had the lite member's (cbb-lite-*), left out.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-linux-amd64.tar.gz' --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          for a in *-linux-amd64.tar.gz; do
            case $a in *-lite-*) ;; *) tar -xzf "$a" ;; esac
          done
          # The folder that holds cbb, with cbb-helper beside it from 0.6 on.
          mv "$(dirname "$(find . -mindepth 2 -maxdepth 2 -type f -name cbb)")" member
          member/cbb version
      - name: the build under test, cbb and cbb-helper beside it, as the release after it
        run: |
          old=$("$RUNNER_TEMP/old/member/cbb" version | sed -n 's/^[a-z]* v\{0,1\}\([0-9][0-9.]*\).*/\1/p' | head -n 1)
          new="${old%.*}.$((${old##*.} + 1))"
          rustup toolchain install stable --profile minimal
          rustup default stable
          CBB_VERSION=$new cargo build --locked --release -p cbb-member
          mkdir -p "$RUNNER_TEMP/new"
          cp target/release/cbb "$RUNNER_TEMP/new/cbb"
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/HunterEwok/cbb/internal/version.Version=v$new" \
            -o "$RUNNER_TEMP/new/cbb-helper" ./cmd/cbb-helper
      - name: members of the release update one at a time and keep syncing (tools/e2e/upgrade.sh)
        run: sh tools/e2e/upgrade.sh "$RUNNER_TEMP/old/member/cbb" "$RUNNER_TEMP/new/cbb"

  avahi:
    name: mdns with avahi
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build the mDNS tests
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/mdns.test" ./internal/mdns
      - name: run them beside avahi-daemon in a container
        run: |
          docker run --rm -v "$RUNNER_TEMP:/t:ro" debian:stable-slim sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq avahi-daemon avahi-utils dbus >/dev/null
            mkdir -p /run/dbus
            dbus-daemon --system --fork
            avahi-daemon --daemonize --no-chroot
            sleep 2
            CBB_TEST_AVAHI=1 /t/mdns.test -test.v -test.run "TestAvahi|TestSystemNetwork"
          '

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: cbb and cbb-helper beside it
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --release -p cbb-member
          mkdir -p "$RUNNER_TEMP/rust"
          cp target/release/cbb "$RUNNER_TEMP/rust/cbb"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/rust/cbb-helper" ./cmd/cbb-helper
      - name: four members and avahi in containers
        run: sh tools/e2e/e2e.sh "$RUNNER_TEMP/rust/cbb"

  desktop:
    name: desktop clipboards
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: install sway, Xvfb, xterm, foot and the clipboard tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends sway wl-clipboard xvfb xclip xterm foot >/dev/null
      - name: Wayland data-control under headless sway, and X11 under Xvfb
        run: |
          go test -c -o "$RUNNER_TEMP/desktop.test" ./internal/desktop
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway >"$RUNNER_TEMP/sway.log" 2>&1 &
          Xvfb :5 -screen 0 640x480x24 -noreset >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 100); do
            WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -n 1)
            [ -n "$WAYLAND_DISPLAY" ] && [ -e /tmp/.X11-unix/X5 ] && break
            sleep 0.1
          done
          export WAYLAND_DISPLAY DISPLAY=:5
          CBB_TEST_WAYLAND=1 CBB_TEST_X11=1 "$RUNNER_TEMP/desktop.test" -test.v
      - name: the uinput keyboard against the kernel
        run: |
          go test -c -o "$RUNNER_TEMP/uinput.test" ./internal/uinput
          sudo modprobe uinput
          sudo CBB_TEST_UINPUT=1 "$RUNNER_TEMP/uinput.test" -test.v -test.run TestKeyboard

  packaging:
    name: packaging
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the OPNsense plugin hook
        run: php tools/e2e/opnsense-hook.php
      - name: the software bills of materials, as the release makes them (tools/sbom)
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sbom-cbb-helper" ./cmd/cbb-helper
          out=$RUNNER_TEMP/sbom
          mkdir -p "$out"
          go run ./tools/sbom go -o "$out/sbom-go.cdx.json" -version v0.0.0 "$RUNNER_TEMP/sbom-cbb-helper"
          go run ./tools/sbom cargo -o "$out/sbom-member.cdx.json" -version v0.0.0 -manifest Cargo.toml \
            -package cbb-member -target x86_64-unknown-linux-musl,mips-unknown-linux-musl
          go run ./tools/sbom cargo -o "$out/sbom-phone-core.cdx.json" -version v0.0.0 -manifest Cargo.toml \
            -package cbb-ffi -target aarch64-apple-ios,aarch64-linux-android
          go run ./tools/sbom swift -o "$out/sbom-ios-kit.cdx.json" -version v0.0.0 apps/ios/CBBKit/Package.resolved
          for f in "$out"/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "$f" >/dev/null
          done
          # The Go programs carry golang.org/x/crypto; cbb, rustls.
          jq -e 'any(.components[]; .name == "golang.org/x/crypto")' "$out/sbom-go.cdx.json" >/dev/null
          jq -e 'any(.components[]; .name == "rustls")' "$out/sbom-member.cdx.json" >/dev/null
      - name: cbb and cbb-helper beside it, as the release packs them
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --release -p cbb-member
          cp target/release/cbb "$RUNNER_TEMP/cbb"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/cbb-helper" ./cmd/cbb-helper
      - name: systemd-analyze verify
        run: |
          # With cbb-helper beside it, as the archive installs it.
          sudo install -m 0755 "$RUNNER_TEMP/cbb" /usr/local/bin/cbb
          sudo install -m 0755 "$RUNNER_TEMP/cbb-helper" /usr/local/bin/cbb-helper
          sudo systemd-sysusers "$PWD/packaging/linux/cbb.sysusers"
          systemd-analyze verify packaging/linux/cbb.service
          systemd-analyze security --offline=true packaging/linux/cbb.service --threshold=30 # 3.0 on the scale it prints
          # The unit with the drop-in that install.sh writes for cbb
          # without its helper (small.conf).
          sudo install -m 0644 packaging/linux/cbb.service /etc/systemd/system/cbb.service
          sudo install -d /etc/systemd/system/cbb.service.d
          printf '[Service]\nIPAddressDeny=\nIPAddressAllow=\n' | sudo tee /etc/systemd/system/cbb.service.d/small.conf >/dev/null
          systemd-analyze verify /etc/systemd/system/cbb.service
          sudo rm -rf /etc/systemd/system/cbb.service /etc/systemd/system/cbb.service.d
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/cbb-forward" ./cmd/cbb-forward
          cp target/release/cbb-relay "$RUNNER_TEMP/cbb-relay"
          for u in cbb-forward cbb-relay; do
            sudo install -m 0755 "$RUNNER_TEMP/$u" "/usr/local/bin/$u"
            systemd-analyze verify "packaging/linux/$u.service"
            systemd-analyze security --offline=true "packaging/linux/$u.service" --threshold=20
          done
      - name: release notes
        run: |
          sh packaging/release-notes.sh v0.1.1 >/dev/null
          sh packaging/release-notes.sh v9.9.9-rc.1 >/dev/null # a pre-release takes Unreleased
      - name: the Homebrew formula takes its checksums from SHA256SUMS, and all four
        run: |
          sums="$RUNNER_TEMP/SHA256SUMS"
          for n in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            printf '%s  cbb-%s.tar.gz\n' "$(printf %s "$n" | sha256sum | cut -d' ' -f1)" "$n"
          done >"$sums"
          sh packaging/homebrew/formula.sh v1.2.3 "$sums" >"$RUNNER_TEMP/cbb.rb"
          ruby -c "$RUNNER_TEMP/cbb.rb"
          grep -qF "$(printf darwin-arm64 | sha256sum | cut -d' ' -f1)" "$RUNNER_TEMP/cbb.rb"
          grep -qF 'releases/download/v1.2.3/cbb-linux-arm64.tar.gz' "$RUNNER_TEMP/cbb.rb"
          sed -i /linux-arm64/d "$sums"
          if sh packaging/homebrew/formula.sh v1.2.3 "$sums" >/dev/null; then
            echo "formula.sh wrote a formula without a checksum" >&2
            exit 1
          fi
      - name: the winget manifest takes its checksums from SHA256SUMS, for both zips
        run: |
          sums="$RUNNER_TEMP/SHA256SUMS"
          for n in amd64 arm64; do
            printf '%s  cbb-windows-%s.zip\n' "$(printf %s "$n" | sha256sum | cut -d' ' -f1)" "$n"
          done >"$sums"
          out="$RUNNER_TEMP/winget"
          sh packaging/winget/manifest.sh v1.2.3 "$sums" "$out"
          for f in "$out"/*.yaml; do ruby -ryaml -e 'YAML.safe_load(File.read(ARGV[0]))' "$f"; done
          test "$(find "$out" -type f | wc -l)" -eq 3
          grep -qF "$(printf arm64 | sha256sum | cut -d' ' -f1 | tr a-f A-F)" "$out/HunterEwok.cbb.installer.yaml"
          grep -qF 'releases/download/v1.2.3/cbb-windows-amd64.zip' "$out/HunterEwok.cbb.installer.yaml"
          sed -i /arm64/d "$sums"
          if sh packaging/winget/manifest.sh v1.2.3 "$sums" "$RUNNER_TEMP/winget2"; then
            echo "manifest.sh wrote a manifest without a checksum" >&2
            exit 1
          fi
      - name: desktop entry
        run: |
          sudo apt-get install -y -qq desktop-file-utils >/dev/null
          desktop-file-validate packaging/linux/cbb-desktop.desktop
      - name: get.sh installs a release archive and refuses a changed one
        run: |
          # The archive as the release workflow makes it, with cbb-helper.
          rel="$RUNNER_TEMP/release"
          sh packaging/archive.sh "$RUNNER_TEMP/cbb" linux amd64 "$rel"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          sudo CBB_VERIFY=skip CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall
          systemctl is-active cbb.service
          # The helper beside cbb, root's, as cbb takes it.
          test "$(stat -c '%U %a' /usr/local/bin/cbb-helper)" = "root 755"
          for _ in $(seq 20); do sudo cbb status && break; sleep 0.5; done
          sudo cbb status | grep -q 'Not in a group'
          echo tampered >>"$rel/cbb-linux-amd64.tar.gz"
          if sudo CBB_VERIFY=skip CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall; then
            echo "get.sh installed an archive that does not match SHA256SUMS" >&2
            exit 1
          fi
      - name: get.sh checks the release's signature
        run: |
          # A release signed with throwaway keys (tools/release-sign drill).
          rel="$RUNNER_TEMP/signed"
          sh packaging/archive.sh "$RUNNER_TEMP/cbb" linux amd64 "$rel"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          go run ./tools/release-sign drill -version 0.6.0 "$rel" "$RUNNER_TEMP/roots.pem"
          export CBB_RELEASE_DIR="$rel" CBB_RELEASE_ROOTS="$RUNNER_TEMP/roots.pem"
          sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY sh packaging/get.sh --no-firewall | grep "signature checks out (0.6.0)" >/dev/null
          # stable.json renewed by a channel key, as cbb.tools does.
          go run ./tools/release-sign drill -version 0.6.0 -channel-key "$rel" "$RUNNER_TEMP/roots.pem"
          sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY sh packaging/get.sh --no-firewall | grep "signature checks out (0.6.0)" >/dev/null
          refused() {
            if sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY sh packaging/get.sh --no-firewall; then
              echo "get.sh installed a release with $1" >&2
              exit 1
            fi
          }
          # The archive and SHA256SUMS changed together after signing.
          cp "$rel/cbb-linux-amd64.tar.gz" "$RUNNER_TEMP/good.tar.gz"
          echo tampered >>"$rel/cbb-linux-amd64.tar.gz"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          refused "an archive that release.json does not list"
          cp "$RUNNER_TEMP/good.tar.gz" "$rel/cbb-linux-amd64.tar.gz"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          # A release of another channel that stable.json names.
          go run ./tools/release-sign drill -version 0.6.0 -release-channel beta "$rel" "$RUNNER_TEMP/roots.pem"
          refused "a release.json of another channel"
          go run ./tools/release-sign drill -version 0.6.0 "$rel" "$RUNNER_TEMP/roots.pem"
          # Another project's roots.
          mkdir "$RUNNER_TEMP/other" && echo other >"$RUNNER_TEMP/other/SHA256SUMS"
          go run ./tools/release-sign drill "$RUNNER_TEMP/other" "$RUNNER_TEMP/other.pem"
          CBB_RELEASE_ROOTS="$RUNNER_TEMP/other.pem" refused "keys.json from other roots"
          CBB_RELEASE_ROOTS='' refused "keys.json from throwaway roots instead of the pinned ones"
          # keys.json with each fault that no reader takes.
          for f in empty-use upper-case twice null no-time status-brace; do
            go run ./tools/release-sign drill -version 0.6.0 -fault "$f" "$rel" "$RUNNER_TEMP/roots.pem"
            refused "keys.json with the fault $f"
          done
          go run ./tools/release-sign drill -version 0.6.0 "$rel" "$RUNNER_TEMP/roots.pem"
          sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY sh packaging/get.sh --no-firewall | grep "signature checks out" >/dev/null
          rm "$rel/stable.json"
          refused "no stable.json"
          CBB_VERIFY=skip sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY sh packaging/get.sh --no-firewall | grep "Not checked" >/dev/null
      - name: cbb update installs a newer signed release, puts the old one back, and sets the timer
        run: |
          # cbb and its helper of one version: a release cbb takes only a
          # helper of its own release.
          version() {
            CBB_VERSION=$1 cargo build --locked --release -p cbb-member
            cp target/release/cbb "$2/cbb"
            CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/HunterEwok/cbb/internal/version.Version=v$1" -o "$2/cbb-helper" ./cmd/cbb-helper
          }
          mkdir -p "$RUNNER_TEMP/v060" "$RUNNER_TEMP/v061"
          version 0.6.0 "$RUNNER_TEMP/v060"
          version 0.6.1 "$RUNNER_TEMP/v061"
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh --auto-update off "$RUNNER_TEMP/v060/cbb"
          test "$(sudo cbb update -auto)" = off
          # 0.6.1, signed with throwaway keys (tools/release-sign drill),
          # which the pinned roots refuse.
          rel="$RUNNER_TEMP/update"
          sh packaging/archive.sh "$RUNNER_TEMP/v061/cbb" linux amd64 "$rel"
          go run ./tools/release-sign drill -version 0.6.1 "$rel" "$RUNNER_TEMP/update.pem"
          if CBB_RELEASE_DIR="$rel" cbb update -check 2>"$RUNNER_TEMP/err"; then echo "cbb update took a release the pinned roots did not sign" >&2; exit 1; fi
          grep -q 'keys.json' "$RUNNER_TEMP/err"
          export CBB_RELEASE_DIR="$rel" CBB_RELEASE_ROOTS="$RUNNER_TEMP/update.pem"
          cbb update -check | grep -q '0.6.1 is available'
          sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY cbb update
          cbb version | grep -q '^cbb 0.6.1 '
          sudo cbb status | grep -q 'Not in a group'
          sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY cbb update | grep -q 'is the newest release'
          # 0.6.2, whose service never starts: 0.6.1 goes back, and 0.6.2 is a failed version.
          rel2="$RUNNER_TEMP/update2"
          mkdir -p "$RUNNER_TEMP/v062"
          cat >"$RUNNER_TEMP/v062/cbb" <<'EOF'
          #!/bin/sh
          case $1 in
          version) echo "cbb 0.6.2 (linux/x86_64)" ;;
          service) exit 1 ;;
          esac
          EOF
          chmod 0755 "$RUNNER_TEMP/v062/cbb"
          sh packaging/archive.sh "$RUNNER_TEMP/v062/cbb" linux amd64 "$rel2"
          go run ./tools/release-sign drill -version 0.6.2 "$rel2" "$RUNNER_TEMP/update2.pem"
          if sudo CBB_RELEASE_DIR="$rel2" CBB_RELEASE_ROOTS="$RUNNER_TEMP/update2.pem" cbb update 2>"$RUNNER_TEMP/err"; then
            echo "cbb update kept a release whose service does not start" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/err"
          grep -q '0.6.1 is back' "$RUNNER_TEMP/err"
          cbb version | grep -q '^cbb 0.6.1 '
          sudo cbb status | grep -q 'Not in a group'
          sudo grep -q '"0.6.2"' /var/lib/cbb-update/update.json
          # The timer.
          sudo cbb update -auto on
          systemctl is-enabled -q cbb-update.timer
          systemctl cat cbb-update.service | grep -qx 'ExecStart=/usr/local/bin/cbb update -timer'
          sudo cbb update -auto off
          test ! -e /etc/systemd/system/cbb-update.timer
          sudo cbb update -auto on
          sudo sh /usr/local/share/cbb/uninstall.sh --purge
          test ! -e /etc/systemd/system/cbb-update.timer
          test ! -e /var/lib/cbb-update
      - name: install.sh keeps a port, and uninstall.sh removes it all
        run: |
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh --port 9000 "$RUNNER_TEMP/cbb" | grep 'TCP port 9000' >/dev/null
          test -x /usr/local/bin/cbb-helper
          grep -qx 'CBB_PORT=9000' /etc/cbb/cbb.env
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh "$RUNNER_TEMP/cbb" | grep 'TCP port 9000' >/dev/null
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh --console --uinput --port 8764 "$RUNNER_TEMP/cbb" | grep 'TCP port 8764' >/dev/null
          systemctl is-enabled -q cbb-console.service
          systemctl is-enabled -q cbb-uinput.service
          grep -qx uinput /etc/modules-load.d/cbb-uinput.conf
          # The helper holds its keyboard and listens for the desktop connectors.
          for _ in $(seq 1 50); do [ -S /run/cbb-keys/keys ] && break; sleep 0.2; done
          test -S /run/cbb-keys/keys || { journalctl -u cbb-uinput --no-pager; exit 1; }
          test ! -e /etc/cbb/cbb.env
          # A CBB_INTERFACES line set by hand survives the next install.
          dev=$(ip route show default | awk '{print $5; exit}')
          echo "CBB_INTERFACES=$dev" | sudo tee /etc/cbb/cbb.env >/dev/null
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh "$RUNNER_TEMP/cbb" | grep 'TCP port 8764' >/dev/null
          grep -qx "CBB_INTERFACES=$dev" /etc/cbb/cbb.env
          # The desktop agent's user unit, enabled for every user's graphical session.
          test -L /etc/systemd/user/graphical-session.target.wants/cbb-agent.service
          sudo sh /usr/local/share/cbb/uninstall.sh --purge
          for f in /usr/local/bin/cbb /usr/local/bin/cbb-helper /etc/systemd/system/cbb.service /etc/systemd/system/cbb-console.service /usr/local/share/cbb /etc/cbb /var/lib/cbb /var/lib/cbb-update \
            /etc/systemd/system/cbb-uinput.service /etc/modules-load.d/cbb-uinput.conf /run/cbb-keys \
            /etc/systemd/user/cbb-agent.service /etc/systemd/user/graphical-session.target.wants/cbb-agent.service; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
          if grep -q cbb /etc/tmux.conf; then
            echo "uninstall.sh left the tmux line" >&2
            exit 1
          fi
          if getent passwd cbb || getent group cbb; then
            echo "uninstall.sh --purge left the account cbb" >&2
            exit 1
          fi
          # An account cbb that is not the service's is never taken over.
          sudo useradd -M -c "someone else" cbb
          if sudo CBB_FIREWALL=no sh packaging/linux/install.sh "$RUNNER_TEMP/cbb" 2>"$RUNNER_TEMP/err"; then
            echo "install.sh took over another account named cbb" >&2
            exit 1
          fi
          grep -q 'not this service' "$RUNNER_TEMP/err"
          test ! -e /usr/local/bin/cbb
          sudo userdel cbb
      - name: install.sh on SteamOS puts it in /opt with a keep list, and uninstall.sh removes it all
        run: |
          printf 'NAME="SteamOS"\nID=steamos\n' >"$RUNNER_TEMP/os-release"
          sudo CBB_OS_RELEASE="$RUNNER_TEMP/os-release" CBB_FIREWALL=no sh packaging/linux/install.sh --auto-update off "$RUNNER_TEMP/cbb" | tee "$RUNNER_TEMP/out"
          grep -q 'sudo /opt/cbb/bin/cbb pair' "$RUNNER_TEMP/out"
          test -x /opt/cbb/bin/cbb
          test ! -e /usr/local/bin/cbb
          test ! -e /usr/lib/sysusers.d/cbb.conf
          grep -qx "m $USER cbb" /etc/sysusers.d/cbb.conf
          systemctl is-active -q cbb.service
          systemctl cat cbb.service | grep -qx 'ExecStart=/opt/cbb/bin/cbb service'
          grep -qx 'ExecStart=/opt/cbb/bin/cbb agent' /etc/systemd/user/cbb-agent.service
          grep -qx 'Exec=/opt/cbb/bin/cbb agent' /etc/xdg/autostart/cbb-desktop.desktop
          grep -qxF 'source-file -q /opt/cbb/share/tmux.conf' /etc/tmux.conf
          grep -qx '/etc/sysusers.d/cbb.conf' /etc/atomic-update.conf.d/cbb.conf
          sudo /opt/cbb/bin/cbb status | grep -q 'Not in a group'
          # cbb update's folder and timer follow the program to /opt.
          sudo /opt/cbb/bin/cbb update -auto on
          systemctl cat cbb-update.service | grep -qx 'ExecStart=/opt/cbb/bin/cbb update -timer'
          sudo test -d /opt/cbb-update
          test ! -e /var/lib/cbb-update
          # A second run keeps the group's members.
          sudo CBB_OS_RELEASE="$RUNNER_TEMP/os-release" CBB_FIREWALL=no sh packaging/linux/install.sh "$RUNNER_TEMP/cbb" >/dev/null
          test "$(grep -c "^m $USER cbb$" /etc/sysusers.d/cbb.conf)" = 1
          sudo sh /opt/cbb/share/uninstall.sh --purge
          for f in /opt/cbb /opt/cbb-update /etc/sysusers.d/cbb.conf /etc/atomic-update.conf.d/cbb.conf \
            /etc/profile.d/cbb-path.sh /etc/systemd/system/cbb.service /etc/systemd/system/cbb-update.timer \
            /etc/systemd/user/cbb-agent.service /etc/xdg/autostart/cbb-desktop.desktop /etc/cbb /var/lib/cbb; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
          if grep -q cbb /etc/tmux.conf; then
            echo "uninstall.sh left the tmux line" >&2
            exit 1
          fi
      - name: install.sh --rootless runs the service as the user, never as the root of a group, and uninstall.sh removes it
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.2; done
          sh packaging/linux/install.sh --rootless --auto-update off "$RUNNER_TEMP/cbb"
          systemctl --user is-active -q cbb.service
          test -S "$XDG_RUNTIME_DIR/cbb/control.sock"
          test ! -e /usr/local/bin/cbb
          ~/.local/bin/cbb status | grep -q 'Not in a group'
          if ~/.local/bin/cbb new 2>"$RUNNER_TEMP/err"; then
            echo "a rootless install made a group" >&2
            exit 1
          fi
          grep -q 'without root' "$RUNNER_TEMP/err"
          sh ~/.local/share/cbb/uninstall.sh --purge
          for f in ~/.local/bin/cbb ~/.config/systemd/user/cbb.service ~/.config/systemd/user/cbb-agent.service \
            ~/.config/autostart/cbb-desktop.desktop ~/.local/share/cbb ~/.local/state/cbb ~/.local/state/cbb-update; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done

  homebrew:
    name: homebrew
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the formula installs a release archive
        run: |
          # The archive as the release workflow makes it; the formula wants the
          # other three too, so they are copies of it.
          rel="$RUNNER_TEMP/release"
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir -p "$RUNNER_TEMP/bin"
          CBB_VERSION=0.0.1 cargo build --locked --release -p cbb-member
          cp target/release/cbb "$RUNNER_TEMP/bin/cbb"
          go build -trimpath -ldflags "-X github.com/HunterEwok/cbb/internal/version.Version=v0.0.1" -o "$RUNNER_TEMP/bin/cbb-helper" ./cmd/cbb-helper
          sh packaging/archive.sh "$RUNNER_TEMP/bin/cbb" darwin arm64 "$rel"
          for n in darwin-amd64 linux-amd64 linux-arm64; do
            cp "$rel/cbb-darwin-arm64.tar.gz" "$rel/cbb-$n.tar.gz"
          done
          (cd "$rel" && shasum -a 256 -- *.tar.gz >SHA256SUMS)
          brew tap-new --no-git local/test
          # Homebrew from 5.2 on loads formulas only from taps one trusts;
          # earlier ones have no brew trust.
          if brew trust --help >/dev/null 2>&1; then brew trust local/test; fi
          formula="$(brew --repository local/test)/Formula/cbb.rb"
          sh packaging/homebrew/formula.sh v0.0.1 "$rel/SHA256SUMS" "file://$rel" >"$formula"
          cat "$formula"
          brew audit --strict local/test/cbb
          brew install local/test/cbb
          brew test local/test/cbb
          "$(brew --prefix)/bin/cbb" version | grep -q '^cbb 0.0.1 '
      - name: install.sh --in-place runs a root-owned copy of Homebrew's binary, and uninstall.sh removes it all
        run: |
          opt="$(brew --prefix)/opt/cbb"
          share="$opt/share/cbb/packaging/macos"
          daemon=tools.cbb
          sudo sh "$share/install.sh" --express --in-place "$opt/bin/cbb" | tee "$RUNNER_TEMP/install.out"
          grep -q 'express installation' "$RUNNER_TEMP/install.out"
          grep -qx yes /etc/cbb/firewall.answer
          # The service, which holds the group's keys, runs a root-owned copy, never the
          # binary Homebrew's user may replace; the agent runs Homebrew's.
          service="/Library/Application Support/cbb/bin/cbb"
          grep -qF "<string>$service</string>" "/Library/LaunchDaemons/$daemon.plist"
          if grep -qF "<string>$opt/bin/cbb</string>" "/Library/LaunchDaemons/$daemon.plist"; then
            echo "the service runs Homebrew's binary" >&2
            exit 1
          fi
          [ "$(sudo stat -f %Su "$service")" = root ]
          [ "$(sudo stat -f %Su "$(dirname "$service")")" = root ]
          grep -qF "<string>$opt/bin/cbb</string>" "/Library/LaunchAgents/$daemon.agent.plist"
          plutil -lint "/Library/LaunchDaemons/$daemon.plist" "/Library/LaunchAgents/$daemon.agent.plist"
          for _ in $(seq 20); do sudo "$opt/bin/cbb" status && break; sleep 0.5; done
          sudo "$opt/bin/cbb" status | grep -q 'Not in a group'
          fw=/usr/libexec/ApplicationFirewall/socketfilterfw
          sudo "$fw" --listapps | grep -qF "$service"
          # Again, as after an upgrade: it restarts the service and keeps the answer.
          sudo sh "$share/install.sh" --in-place "$opt/bin/cbb" | tee "$RUNNER_TEMP/install.out"
          grep -q 'as answered before' "$RUNNER_TEMP/install.out"
          sudo "$fw" --listapps | grep -qF "$service"
          for _ in $(seq 20); do sudo "$opt/bin/cbb" status && break; sleep 0.5; done
          sudo sh "$share/uninstall.sh" --purge
          for f in "/Library/LaunchDaemons/$daemon.plist" "/Library/LaunchAgents/$daemon.agent.plist" \
            "/Library/Application Support/cbb" /Library/Logs/cbb; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
          if sudo launchctl print "system/$daemon" >/dev/null 2>&1; then
            echo "uninstall.sh left the service running" >&2
            exit 1
          fi
          if sudo "$fw" --listapps | grep -qF "$service"; then
            echo "uninstall.sh left the firewall entry" >&2
            exit 1
          fi
          brew uninstall cbb
      - name: get.sh installs a release archive on a Mac and refuses a changed one
        run: |
          rel="$RUNNER_TEMP/release"
          daemon=tools.cbb
          (cd "$rel" && shasum -a 256 -- *.tar.gz >SHA256SUMS)
          sudo CBB_VERIFY=skip CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall
          for _ in $(seq 20); do sudo /usr/local/bin/cbb status && break; sleep 0.5; done
          sudo /usr/local/bin/cbb status | grep -q 'Not in a group'
          # --port moves the member port, and a reinstall without it keeps it.
          sudo CBB_VERIFY=skip CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall --port 9000 | tee "$RUNNER_TEMP/get.out"
          grep -q 'TCP port 9000' "$RUNNER_TEMP/get.out"
          grep -qx 'CBB_PORT=9000' /etc/cbb/cbb.env
          # The member port listens once the Mac is in a group.
          for _ in $(seq 20); do sudo /usr/local/bin/cbb status >/dev/null && break; sleep 0.5; done
          sudo /usr/local/bin/cbb new
          for _ in $(seq 60); do sudo lsof -nP -iTCP:9000 -sTCP:LISTEN && break; sleep 0.5; done
          if ! sudo lsof -nP -iTCP:9000 -sTCP:LISTEN | grep -q cbb; then
            echo "the member port does not listen in 30 s; the service's log:" >&2
            sudo cat /Library/Logs/cbb/service.log >&2 || true
            exit 1
          fi
          sudo CBB_VERIFY=skip CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall | tee "$RUNNER_TEMP/get.out"
          grep -q 'TCP port 9000' "$RUNNER_TEMP/get.out"
          echo tampered >>"$rel/cbb-darwin-arm64.tar.gz"
          if sudo CBB_VERIFY=skip CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall; then
            echo "get.sh installed an archive that does not match SHA256SUMS" >&2
            exit 1
          fi
          sudo sh /usr/local/share/cbb/uninstall.sh --purge
          for f in /usr/local/bin/cbb /usr/local/share/cbb /etc/cbb "/Library/LaunchDaemons/$daemon.plist"; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done

  windows:
    name: windows installer
    needs: [changes, build]
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cbb-windows-amd64.zip
          path: ${{ runner.temp }}/release
      - name: PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          # Write-Host is what an installer talks with.
          $found = Invoke-ScriptAnalyzer -Path packaging/windows -Recurse -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize -Wrap
          if ($found) { exit 1 }
      - name: the release's get.ps1 carries its translations
        shell: bash
        run: sh packaging/l10n-embed.sh packaging/windows/get.ps1 >"$RUNNER_TEMP/get.ps1"
      - name: the release's get.ps1 speaks the user's language, in Windows PowerShell
        # Windows PowerShell 5.1 reads a downloaded script as Latin-1; the
        # translations come through it in base64. The Spanish catalog's
        # "fallo" with an acute o, written as a code point to keep this file
        # ASCII for PowerShell.
        shell: powershell
        env:
          CBB_LANG: es
          CBB_VERSION: bogus
        run: |
          $out = Get-Content (Join-Path $env:RUNNER_TEMP 'get.ps1') -Raw -Encoding Default | Invoke-Expression 6>&1 | Out-String
          Write-Host $out
          if (-not $out.Contains('fall' + [char]0x00F3) -or -not $out.Contains('CBB_VERSION debe tener la forma v1.2.3')) { throw 'get.ps1 did not speak Spanish' }
      - name: get.ps1 installs a release archive and refuses a changed one
        env:
          CBB_RELEASE_DIR: ${{ runner.temp }}/release
          CBB_VERIFY: skip
          CBB_ERROR_DETAILS: "1"
          CBB_FIREWALL: express
        run: |
          $rel = $env:CBB_RELEASE_DIR
          $zip = Join-Path $rel 'cbb-windows-amd64.zip'
          "$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())  cbb-windows-amd64.zip" | Set-Content (Join-Path $rel 'SHA256SUMS')
          # A junction where the data folder goes is moved aside, never followed.
          $data = Join-Path $env:ProgramData 'cbb'
          $elsewhere = Join-Path $env:RUNNER_TEMP 'elsewhere'
          New-Item -ItemType Directory -Force (Join-Path $elsewhere 'run\kept') | Out-Null
          Set-Content (Join-Path $elsewhere 'kept.txt') 'x'
          New-Item -ItemType Junction -Path $data -Target $elsewhere | Out-Null
          Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression
          if ((Get-Service cbb).Status -ne 'Running') { throw 'the service does not run' }
          if (-not (Test-Path (Join-Path $elsewhere 'kept.txt')) -or -not (Test-Path (Join-Path $elsewhere 'run\kept'))) { throw 'install.ps1 went into the junction' }
          if ((Get-Item -LiteralPath $data -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'the data folder is still the junction' }
          if (-not (Get-ChildItem $env:ProgramData -Filter 'cbb.untrusted-*' -Force)) { throw 'install.ps1 did not move the junction aside' }
          $cbb = "$env:ProgramFiles\cbb\cbb.exe"
          # The tray app, with its sign-in entry and Start menu shortcut.
          if (-not (Test-Path "$env:ProgramFiles\cbb\cbb-desktop.exe")) { throw 'no tray app' }
          if (-not (Test-Path "$env:ProgramFiles\cbb\cbb-helper.exe")) { throw 'no cbb-helper.exe' }
          $trayRun = (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run -Name 'cbb tray').'cbb tray'
          if ($trayRun -notmatch 'cbb-desktop\.exe"$') { throw "the tray app's sign-in entry: $trayRun" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CBB.lnk")) { throw 'no Start menu shortcut' }
          $status = & $cbb status | Out-String
          if ($status -notmatch 'Not in a group') { throw "cbb status: $status" }
          $before = (Get-Item $cbb).LastWriteTimeUtc
          Add-Content $zip 'tampered'
          Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression
          if ((Get-Item $cbb).LastWriteTimeUtc -ne $before) { throw 'get.ps1 installed an archive that does not match SHA256SUMS' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: get.ps1 checks the release's signature, in Windows PowerShell
        # Windows PowerShell 5.1 on .NET Framework, as most users run it, and
        # not pwsh: the check builds its keys and signatures for both.
        shell: powershell
        env:
          CBB_ERROR_DETAILS: "1"
          CBB_FIREWALL: express
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $rel = Join-Path $env:RUNNER_TEMP 'signed'
            New-Item -ItemType Directory $rel | Out-Null
            $zip = Join-Path $rel 'cbb-windows-amd64.zip'
            Copy-Item (Join-Path $env:RUNNER_TEMP 'release\cbb-windows-amd64.zip') $zip
            "$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())  cbb-windows-amd64.zip" | Set-Content (Join-Path $rel 'SHA256SUMS')
            $roots = Join-Path $env:RUNNER_TEMP 'roots.pem'
            # Through cmd: Windows PowerShell stops on a native program's stderr (go's "downloading").
            # stable.json signed by a channel key, as cbb.tools renews it.
            cmd /c "go run ./tools/release-sign drill -version 0.6.0 -channel-key `"$rel`" `"$roots`" 2>&1"
            if ($LASTEXITCODE -ne 0) { throw 'release-sign drill failed' }
            $env:CBB_RELEASE_DIR = $rel
            $env:CBB_RELEASE_ROOTS = $roots
            $out = Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression 6>&1 | Out-String
            Write-Host $out
            if ($out -notmatch 'signature checks out \(0\.6\.0\)' -or $out -match 'failed') { throw 'get.ps1 did not install the signed release' }
            # The pinned roots refuse the throwaway ones.
            Remove-Item Env:CBB_RELEASE_ROOTS
            $out = Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression 6>&1 | Out-String
            Write-Host $out
            if ($out -notmatch 'failed') { throw 'get.ps1 took keys.json from throwaway roots' }
            $env:CBB_RELEASE_ROOTS = $roots
            # A release of another channel that stable.json names.
            cmd /c "go run ./tools/release-sign drill -version 0.6.0 -channel-key -release-channel beta `"$rel`" `"$roots`" 2>&1"
            if ($LASTEXITCODE -ne 0) { throw 'release-sign drill failed' }
            $out = Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression 6>&1 | Out-String
            Write-Host $out
            if ($out -notmatch 'failed') { throw 'get.ps1 installed a release.json of another channel' }
            # keys.json with each fault that no reader takes.
            foreach ($f in 'empty-use', 'upper-case', 'twice', 'null', 'no-time', 'status-brace') {
              cmd /c "go run ./tools/release-sign drill -version 0.6.0 -fault $f `"$rel`" `"$roots`" 2>&1"
              if ($LASTEXITCODE -ne 0) { throw 'release-sign drill failed' }
              $out = Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression 6>&1 | Out-String
              Write-Host $out
              if ($out -notmatch 'failed') { throw "get.ps1 installed a release whose keys.json has the fault $f" }
            }
            cmd /c "go run ./tools/release-sign drill -version 0.6.0 -channel-key `"$rel`" `"$roots`" 2>&1"
            if ($LASTEXITCODE -ne 0) { throw 'release-sign drill failed' }
            Remove-Item (Join-Path $rel 'stable.json')
            $out = Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression 6>&1 | Out-String
            Write-Host $out
            if ($out -notmatch 'failed') { throw 'get.ps1 installed a release without stable.json' }
          } catch {
            Write-Host "$($_.Exception.Message)`n$($_.ScriptStackTrace)"
            exit 1
          }
          # Not the exit code of the last program get.ps1 ran.
          exit 0
      - name: install.ps1 keeps a port and the firewall rules follow it, and uninstall.ps1 removes it all
        env:
          CBB_ERROR_DETAILS: "1"
        run: |
          Expand-Archive "$env:RUNNER_TEMP\release\cbb-windows-amd64.zip" "$env:RUNNER_TEMP\unpacked"
          $install = "$env:RUNNER_TEMP\unpacked\cbb\packaging\windows\install.ps1"
          function ports { @(Get-NetFirewallRule -Group cbb -Direction Inbound -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'cbb-hub' } | Get-NetFirewallPortFilter | ForEach-Object { "$($_.Protocol) $($_.LocalPort)" }) | Sort-Object }
          function check($want) {
            $got = (ports) -join ', '
            if ($got -ne $want) { throw "firewall rules: $got, want $want" }
          }
          $svcKey = 'HKLM:\SYSTEM\CurrentControlSet\Services\cbb'
          # An update without a console over an installation from before the question, which
          # added its rules and kept no answer: the rules count as a Yes and stay, at the new port.
          Remove-ItemProperty $svcKey -Name FirewallAnswer -ErrorAction SilentlyContinue
          # cbb install runs the installer beside it, as after winget.
          & "$env:RUNNER_TEMP\unpacked\cbb\cbb.exe" install -Port 9000
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check 'TCP 9000, UDP 5353'
          if ((Get-ItemProperty $svcKey -Name FirewallAnswer).FirewallAnswer -ne 'yes') { throw 'the earlier rules were not kept as a Yes' }
          # Without a console and without rules nobody answers, which adds none and keeps no answer.
          Get-NetFirewallRule -Group cbb -Direction Inbound | Where-Object { $_.Name -ne 'cbb-hub' } | Remove-NetFirewallRule
          Remove-ItemProperty $svcKey -Name FirewallAnswer
          powershell -NoProfile -ExecutionPolicy Bypass -File $install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check ''
          if (Get-ItemProperty $svcKey -Name FirewallAnswer -ErrorAction SilentlyContinue) { throw 'an answer was kept without one' }
          powershell -NoProfile -ExecutionPolicy Bypass -File $install -Express
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check 'TCP 9000, UDP 5353'
          powershell -NoProfile -ExecutionPolicy Bypass -File $install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check 'TCP 9000, UDP 5353'
          $svcEnv = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\cbb).Environment
          if ($svcEnv -ne 'CBB_PORT=9000') { throw "the service environment: $svcEnv" }
          function homeOnly($want) {
            $r = Get-NetFirewallRule -Name cbb-home-only -ErrorAction SilentlyContinue
            $got = if ($r) { "$($r.Direction) $($r.Action) $($r.Enabled)" } else { 'none' }
            if ($got -ne $want) { throw "the outbound rule: $got, want $want" }
          }
          homeOnly 'Outbound Block True'
          $filter = Get-NetFirewallRule -Name cbb-home-only | Get-NetFirewallAddressFilter
          if ($filter.RemoteAddress -contains '192.168.0.0/16' -or $filter.RemoteAddress.Count -ne 9) { throw "the outbound rule's addresses: $($filter.RemoteAddress -join ', ')" }
          # cbb global lets the service reach the group's servers and nothing else beyond the
          # home network, a reinstall keeps that, and cbb global off takes it back.
          function blocked($rule) { @((Get-NetFirewallRule -Name $rule | Get-NetFirewallAddressFilter).RemoteAddress) }
          function awayAllow($want) {
            $got = [string](Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\cbb -Name AwayAllow -ErrorAction SilentlyContinue).AwayAllow
            if ($got -ne $want) { throw "AwayAllow: '$got', want '$want'" }
          }
          $cbb = "$env:ProgramFiles\cbb\cbb.exe"
          & $cbb new
          if ($LASTEXITCODE -ne 0) { throw 'cbb new failed' }
          'yes' | & $cbb global on
          if ($LASTEXITCODE -ne 0) { throw 'cbb global on failed' }
          # No hub yet: on, and still nothing beyond the home network.
          awayAllow 'on'
          homeOnly 'Outbound Block True'
          if ((blocked cbb-home-only).Count -ne 9) { throw "with no servers: $(blocked cbb-home-only)" }
          & $cbb global hub -forwarder 198.51.100.9:8764 -forwarder-key "$('A' * 43)="
          if ($LASTEXITCODE -ne 0) { throw 'cbb global hub -forwarder failed' }
          awayAllow 'on 198.51.100.9'
          $b = blocked cbb-home-only
          if ($b.Count -ne 10 -or $b -notcontains '172.32.0.0-192.167.255.255' -or $b -notcontains '198.51.100.10-223.255.255.255') { throw "with the forwarder: $($b -join ', ')" }
          # -HomeCgnat on makes 100.64.0.0/10 home: in the service's environment, the inbound
          # rules and the outbound rule, which the installer has cbb global allow write again.
          powershell -NoProfile -ExecutionPolicy Bypass -File $install -HomeCgnat on
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $svcEnv = @((Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\cbb).Environment)
          if ($svcEnv -notcontains 'CBB_HOME_CGNAT=1' -or $svcEnv -notcontains 'CBB_PORT=9000') { throw "the service environment: $svcEnv" }
          awayAllow 'on 198.51.100.9 cgnat'
          $b = blocked cbb-home-only
          if ($b.Count -ne 11 -or $b -notcontains '11.0.0.0-100.63.255.255' -or $b -notcontains '100.128.0.0-126.255.255.255') { throw "with -HomeCgnat on: $($b -join ', ')" }
          $in = @(Get-NetFirewallRule -Group cbb -Direction Inbound | Get-NetFirewallAddressFilter | ForEach-Object { $_.RemoteAddress })
          if (-not ($in -match '^100\.64\.0\.0')) { throw "the inbound rules' addresses: $($in -join ', ')" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $install -HomeCgnat off
          if ($LASTEXITCODE -ne 0) { exit 1 }
          awayAllow 'on 198.51.100.9'
          if ((blocked cbb-home-only).Count -ne 10) { throw "after -HomeCgnat off: $(blocked cbb-home-only)" }
          # A hub at its own address answers its clients anywhere on its UDP port only.
          # Without a console nobody answers, and the hub's port stays closed.
          & $cbb global hub 203.0.113.7:8764
          if ($LASTEXITCODE -ne 0) { throw 'cbb global hub failed' }
          if (Get-NetFirewallRule -Name cbb-hub -ErrorAction SilentlyContinue) { throw 'the hub''s port was opened without an answer' }
          & $cbb global hub -firewall yes 203.0.113.7:8764
          if ($LASTEXITCODE -ne 0) { throw 'cbb global hub -firewall yes failed' }
          $hp = Get-NetFirewallRule -Name cbb-hub | Get-NetFirewallPortFilter
          if ("$($hp.Protocol) $($hp.LocalPort)" -ne 'UDP 8764') { throw "the hub's port rule: $($hp.Protocol) $($hp.LocalPort)" }
          awayAllow 'on hub-port:8764'
          $udp = Get-NetFirewallRule -Name cbb-home-only-udp | Get-NetFirewallPortFilter
          if ("$($udp.Protocol) $($udp.LocalPort -join ',')" -ne 'UDP 1-8763,8765-65535') { throw "the UDP rule: $($udp.Protocol) $($udp.LocalPort)" }
          if ((Get-NetFirewallRule -Name cbb-home-only | Get-NetFirewallPortFilter).Protocol -ne 'TCP') { throw 'the hub''s rule does not block TCP' }
          powershell -NoProfile -ExecutionPolicy Bypass -File $install -Port 8764 -NoFirewall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check ''
          awayAllow 'on hub-port:8764'
          if (-not (Get-NetFirewallRule -Name cbb-home-only-udp -ErrorAction SilentlyContinue)) { throw 'a reinstall dropped the hub''s UDP rule' }
          if (-not (Get-NetFirewallRule -Name cbb-hub -ErrorAction SilentlyContinue)) { throw 'a reinstall dropped the hub''s port' }
          & $cbb global off
          if ($LASTEXITCODE -ne 0) { throw 'cbb global off failed' }
          awayAllow ''
          if (Get-NetFirewallRule -Name cbb-hub -ErrorAction SilentlyContinue) { throw 'cbb global off left the hub''s port open' }
          homeOnly 'Outbound Block True'
          if ((blocked cbb-home-only).Count -ne 9 -or (Get-NetFirewallRule -Name cbb-home-only-udp -ErrorAction SilentlyContinue)) { throw 'cbb global off left the servers' }
          # The answer -NoFirewall gave is kept, until -Express.
          powershell -NoProfile -ExecutionPolicy Bypass -File $install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check ''
          powershell -NoProfile -ExecutionPolicy Bypass -File $install -Express
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check 'TCP 8764, UDP 5353'
          # Only the service, the system and administrators reach the keys.
          $acl = (Get-Acl "$env:ProgramData\cbb\state").Access | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique
          $want = @('BUILTIN\Administrators', 'NT AUTHORITY\SYSTEM', 'NT SERVICE\cbb')
          if (Compare-Object $acl $want) { throw "the state folder's access list: $($acl -join ', ')" }
          & "$env:ProgramFiles\cbb\cbb.exe" status
          if ($LASTEXITCODE -ne 0) { throw 'cbb status failed after the reinstalls' }
          Get-Content "$env:ProgramData\cbb\logs\service.log"

          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\cbb\uninstall.ps1" -Purge
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-Service cbb -ErrorAction SilentlyContinue) { throw 'uninstall.ps1 left the service' }
          if (Get-NetFirewallRule -Group cbb -ErrorAction SilentlyContinue) { throw 'uninstall.ps1 left firewall rules' }
          foreach ($p in @("$env:ProgramFiles\cbb", "$env:ProgramData\cbb",
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\cbb')) {
            if (Test-Path $p) { throw "uninstall.ps1 left $p" }
          }
          if (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run -Name cbb -ErrorAction SilentlyContinue) { throw 'uninstall.ps1 left the sign-in entry' }
          if (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run -Name 'cbb tray' -ErrorAction SilentlyContinue) { throw 'uninstall.ps1 left the tray app''s sign-in entry' }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CBB.lnk") { throw 'uninstall.ps1 left the Start menu shortcut' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -match 'cbb') { throw 'uninstall.ps1 left the PATH entry' }
          net.exe localgroup cbb 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'uninstall.ps1 -Purge left the group' }
          $global:LASTEXITCODE = 0
      - name: cbb update installs a newer signed release from a copy of itself, and sets the task
        env:
          CBB_ERROR_DETAILS: "1"
        run: |
          # The Rust cbb and cbbw.exe of release v, and beside them the Go
          # helper of the same release, which cbb updates from its system's
          # archive with and which a release cbb requires.
          function build($v) {
            $dir = Join-Path $env:RUNNER_TEMP "v$v\cbb"
            New-Item -ItemType Directory -Force "$dir\packaging" | Out-Null
            $env:CBB_VERSION = $v
            $env:CBB_ARCH = 'amd64'
            cargo build --locked -p cbb-member --features windowless --target-dir "$env:RUNNER_TEMP\target"
            if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
            Copy-Item "$env:RUNNER_TEMP\target\debug\cbb.exe", "$env:RUNNER_TEMP\target\debug\cbbw.exe" $dir
            $ld = "-X github.com/HunterEwok/cbb/internal/version.Version=v$v"
            go build -trimpath -ldflags $ld -o "$dir\cbb-helper.exe" ./cmd/cbb-helper
            if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
            Copy-Item -Recurse packaging\windows "$dir\packaging\"
            Copy-Item -Recurse packaging\l10n "$dir\packaging\"
            return $dir
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
          $old = build '0.6.0'
          $new = build '0.6.1'
          Remove-Item Env:CBB_VERSION, Env:CBB_ARCH
          powershell -NoProfile -ExecutionPolicy Bypass -File "$old\packaging\windows\install.ps1" -AutoUpdate off -NoFirewall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $cbb = "$env:ProgramFiles\cbb\cbb.exe"
          if ((& $cbb update -auto | Out-String).Trim() -ne 'off') { throw 'install.ps1 -AutoUpdate off was not kept' }
          $rel = Join-Path $env:RUNNER_TEMP 'update'
          New-Item -ItemType Directory $rel | Out-Null
          Compress-Archive -Path $new -DestinationPath "$rel\cbb-windows-amd64.zip"
          go run ./tools/release-sign drill -version 0.6.1 $rel "$env:RUNNER_TEMP\update.pem"
          if ($LASTEXITCODE -ne 0) { throw 'release-sign drill failed' }
          $env:CBB_RELEASE_DIR = $rel
          $env:CBB_RELEASE_ROOTS = "$env:RUNNER_TEMP\update.pem"
          $out = & $cbb update -check | Out-String
          if ($out -notmatch '0\.6\.1 is available') { throw "cbb update -check: $out" }
          # It runs from a copy, since install.ps1 stops every cbb in Program Files\cbb.
          & $cbb update
          if ($LASTEXITCODE -ne 0) { throw 'cbb update failed' }
          $v = & $cbb version | Out-String
          if ($v -notmatch '^cbb 0\.6\.1 ') { throw "after the update: $v" }
          if ((Get-Service cbb).Status -ne 'Running') { throw 'the service does not run' }
          $out = & $cbb update | Out-String
          if ($out -notmatch 'newest release') { throw "a second cbb update: $out" }
          & $cbb update -auto on
          if ($LASTEXITCODE -ne 0) { throw 'cbb update -auto on failed' }
          $task = Get-ScheduledTask -TaskName 'cbb update'
          if ($task.Principal.UserId -ne 'SYSTEM' -or $task.Actions[0].Execute -notmatch 'cbbw\.exe$') { throw "the task: $($task.Principal.UserId) $($task.Actions[0].Execute)" }
          & $cbb update -auto off
          if (Get-ScheduledTask -TaskName 'cbb update' -ErrorAction SilentlyContinue) { throw 'cbb update -auto off left the task' }
          & $cbb update -auto on
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\cbb\uninstall.ps1" -Purge
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-ScheduledTask -TaskName 'cbb update' -ErrorAction SilentlyContinue) { throw 'uninstall.ps1 left the task' }
          if (Test-Path "$env:ProgramFiles\cbb-update") { throw 'uninstall.ps1 left cbb update''s folder' }

  kit:
    name: phone kit (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Rust core, which the kit links
        # Built on the runner: the Swift container has no Rust.
        run: sh ffi/bind.sh host "$RUNNER_TEMP/core"
      - name: swift test (in the Swift container on Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir interop-out
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/core:/core" -w /src/apps/ios/CBBKit -e CBB_INTEROP_OUT=/src/interop-out swift:6.2-noble sh -euc '
            swift test -Xlinker -L/core
            swift build -c release --product cbb-interop --static-swift-stdlib -Xlinker -L/core
            cp "$(swift build -c release --show-bin-path)/cbb-interop" /src/cbb-interop'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'Linux'
        with:
          go-version-file: go.mod
          cache: false
      - name: the core and Go read what the Swift phone wrote
        if: runner.os == 'Linux'
        run: |
          # swift test just wrote testdata/interop/swift-member.json, and to
          # interop-out the records it signed, a certificate it renewed and
          # what an admin phone makes.
          cargo test --locked -p cbb-core --lib vectors::swift_member_frames
          CBB_INTEROP_OUT="$PWD/interop-out" go test ./internal/group -run 'TestSwiftRecords|TestSwiftRenewal|TestSwiftAdmin|TestSwiftRoot|TestSwiftComputerAdmin|TestSwiftCommand' -v
      - name: swift test
        if: runner.os == 'macOS'
        working-directory: apps/ios/CBBKit
        run: |
          swift test --enable-code-coverage -Xlinker -L"$RUNNER_TEMP/core"
          cp "$(swift test --show-codecov-path)" "$GITHUB_WORKSPACE/coverage-swift-kit.json"
          swift build --product cbb-interop -Xlinker -L"$RUNNER_TEMP/core"
          cp "$(swift build --show-bin-path)/cbb-interop" "$GITHUB_WORKSPACE/cbb-interop"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'macOS'
        with:
          go-version-file: go.mod
          cache: false
      - name: the Swift phone pairs both ways with the computers' cbb and syncs with it over TLS
        if: runner.os == 'macOS'
        run: |
          # The computer is the Rust cbb, with cbb-helper beside it.
          cargo build --locked --release -p cbb-member
          go build -o target/release/cbb-helper ./cmd/cbb-helper
          # A throwaway keychain for the tool's identity, unlocked and the default.
          security create-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          CBB_TEST_RUST_SERVICE="$PWD/target/release/cbb" CBB_SWIFT_INTEROP_TLS="$PWD/cbb-interop" go test -timeout 5m ./internal/service -run 'TestSwift' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: coverage-swift-kit
          path: coverage-swift-kit.json
          retention-days: 7

  app:
    name: iPhone app
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    # The libraries and the build take about 15 minutes, and a slow runner
    # can spend 5 minutes booting a simulator for each of the retries
    # below: 45 minutes cut off a run whose tests had passed on the iPhone
    # while the iPad's first try was being retried.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build the Rust core, which the kit links
        run: sh ffi/bind.sh ios apps/ios/CbbCore
      - name: generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: build and test on the simulator, signed ad hoc
        working-directory: apps/ios
        run: |
          set -o pipefail
          # The first available iPhone and iPad simulators: the app is universal.
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith(sys.argv[1])))' "$1"
          }
          iphone=$(pick iPhone)
          ipad=$(pick iPad)
          # Ad hoc signing needs no Apple account, and without a signature the
          # simulator gives the app no keychain (-34018), which its TLS tests use.
          sign=(CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=)
          # The simulator at times fails to launch the app for its tests
          # ("Failed to launch app", or the app held at dyld's start, or XCTest
          # never loaded in it), and xcodebuild then waits 8 to 17 minutes
          # before it gives up. A run with no test started after 150 seconds,
          # or one that exits before any test ran, is tried again on the
          # simulator erased and booted again; a run whose tests ran, failed ones included,
          # counts as it is, except for one kind of failure below.
          #
          # XCTest can also connect and then fail to launch the app itself:
          # "Failed to launch <XCUIApplicationImpl ...>: Timed out while
          # launching application via Xcode", seen on the first launch on a
          # simulator fresh from its data migration while the later tests
          # launched it at once. When every failed test failed only so, those
          # tests (and only they) run again on the simulator booted again; a
          # failed assertion is never run again.
          failed_tests() {
            sed -nE "s/^Test Case '-\[([A-Za-z0-9_]+)\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' failed .*/\1\/\2\/\3/p" "$1" | sort -u
          }
          launch_failed() {
            sed -nE "s/.*: error: -\[([A-Za-z0-9_]+)\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\] : Failed to launch <XCUIApplicationImpl.*/\1\/\2\/\3/p" "$1" | sort -u
          }
          only_launches() {
            failed=$(failed_tests "$1")
            [ -n "$failed" ] && [ "$failed" = "$(launch_failed "$1")" ] &&
              ! grep -E ": error: " "$1" | grep -qv ": Failed to launch <XCUIApplicationImpl"
          }
          test_on() {
            log="${RUNNER_TEMP:-/tmp}/test-$1.log"
            only=()
            for attempt in 1 2 3; do
              xcrun simctl boot "$1" 2>/dev/null || true
              # A simulator can hang at boot ("Waiting on System App") for
              # many minutes; five are enough for a good one.
              xcrun simctl bootstatus "$1" -b </dev/null &
              boot=$!
              for second in $(seq 300); do kill -0 "$boot" 2>/dev/null || break; sleep 1; done
              kill "$boot" 2>/dev/null || true
              wait "$boot" || true
              xcodebuild test-without-building -project CBB.xcodeproj -scheme CBB -destination "id=$1" \
                "${sign[@]}" "${only[@]}" >"$log" 2>&1 &
              pid=$!
              killed=
              for second in $(seq 600); do
                kill -0 "$pid" 2>/dev/null || break
                if [ "$second" -ge 150 ] && ! grep -q "^Test Suite " "$log"; then killed=1; break; fi
                sleep 1
              done
              kill -0 "$pid" 2>/dev/null && killed=1
              if [ -n "$killed" ]; then
                kill "$pid" 2>/dev/null || true
                pkill -f "simctl diagnose" || true
                wait "$pid" || true
                status=124
              else
                status=0
                wait "$pid" || status=$?
              fi
              xcrun simctl shutdown "$1" || true
              if [ "$status" -ne 0 ] && [ -z "$killed" ] && [ "$attempt" -lt 3 ] && only_launches "$log"; then
                grep -E "error: |^Test Case .* failed" "$log" || true
                only=()
                for t in $(failed_tests "$log"); do only+=("-only-testing:$t"); done
                echo "::warning::the app did not launch for some tests on $1 (attempt $attempt); running them again: ${only[*]}"
                continue
              fi
              if [ "$status" -eq 0 ] || grep -q "^Test Case " "$log"; then
                # A failed assertion is printed where it happens, often
                # long before the tail: show those lines first.
                grep -E "error: |^Test Case .* failed" "$log" || true
                tail -n 100 "$log"
                [ -n "$killed" ] && echo "::error::the tests on $1 did not finish in 10 minutes"
                return "$status"
              fi
              tail -n 30 "$log"
              echo "::warning::no test started on $1 (attempt $attempt, status $status); erasing the simulator and booting it again"
              # A simulator that failed once tends to fail again as it is:
              # its next try starts from a clean device.
              xcrun simctl shutdown "$1" 2>/dev/null || true
              xcrun simctl erase "$1" || true
            done
            echo "::error::no test started on $1 in three attempts"
            return 1
          }
          # Built once, then tested on one simulator at a time.
          xcodebuild build-for-testing -project CBB.xcodeproj -scheme CBB -destination "id=$iphone" \
            "${sign[@]}" | tail -n 50
          test_on "$iphone"
          test_on "$ipad"
  macapp:
    name: Mac app
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: generate the Xcode project
        working-directory: apps/macos
        run: |
          brew install xcodegen
          xcodegen generate
      - name: build and test, signed ad hoc
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild test -project CBBMac.xcodeproj -scheme CBBMac -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tail -n 200
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the .pkg installs the app and the service, and uninstall.sh removes them
        # As the release builds it (release.yml, "the Mac app and the .pkg"),
        # signed ad hoc and the package unsigned.
        run: |
          set -o pipefail
          (cd apps/macos && xcodebuild build -project CBBMac.xcodeproj -scheme CBBMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO | tail -n 50)
          app="$RUNNER_TEMP/derived/Build/Products/Release/CBB.app"
          sh packaging/macos/sign.sh - "$app"
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          for a in arm64 amd64; do
            t=aarch64-apple-darwin
            [ "$a" = arm64 ] || t=x86_64-apple-darwin
            cargo +stable build --locked --release -p cbb-member --target "$t"
            cp "target/$t/release/cbb" "$RUNNER_TEMP/cbb-$a"
            CGO_ENABLED=1 GOARCH=$a go build -trimpath -o "$RUNNER_TEMP/cbb-helper-$a" ./cmd/cbb-helper
            sh packaging/macos/sign.sh - "$RUNNER_TEMP/cbb-$a"
            sh packaging/macos/sign.sh - "$RUNNER_TEMP/cbb-helper-$a"
          done
          lipo -create "$RUNNER_TEMP/cbb-arm64" "$RUNNER_TEMP/cbb-amd64" -output "$RUNNER_TEMP/cbb"
          lipo -create "$RUNNER_TEMP/cbb-helper-arm64" "$RUNNER_TEMP/cbb-helper-amd64" -output "$RUNNER_TEMP/cbb-helper"
          sh packaging/macos/pkg.sh 0.0.1 "$RUNNER_TEMP/cbb" "$app" "$RUNNER_TEMP/cbb-0.0.1.pkg"
          sudo installer -pkg "$RUNNER_TEMP/cbb-0.0.1.pkg" -target / -verboseR
          [ -x /Applications/CBB.app/Contents/MacOS/CBB ]
          pkgutil --pkg-info tools.cbb.pkg
          for _ in $(seq 20); do sudo /usr/local/bin/cbb status && break; sleep 0.5; done
          sudo /usr/local/bin/cbb status | grep -q 'Not in a group'
          [ ! -e "/Library/Application Support/cbb-package" ]
          # The service's folder is the _cbb account's alone.
          [ -x /usr/local/bin/cbb-helper ] && sudo test -x "/Library/Application Support/cbb/bin/cbb-helper"
          sudo sh /usr/local/share/cbb/uninstall.sh --purge
          for f in /Applications/CBB.app /usr/local/bin/cbb /usr/local/bin/cbb-helper "/Library/Application Support/cbb" /Library/LaunchDaemons/tools.cbb.plist; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
          if pkgutil --pkg-info tools.cbb.pkg >/dev/null 2>&1; then
            echo "uninstall.sh left the package's receipt" >&2
            exit 1
          fi

  trayapp:
    name: tray app (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The runners' Ubuntu mirror sometimes serves these packages at a few
      # kB/s until the job's time is up, so the downloaded .deb files are
      # kept between runs and only the recommended extras are left out. The
      # download has its own time limit and what it fetched is saved even
      # when it runs out, so a slow mirror only delays the job by a run or two
      # instead of never filling the cache.
      - name: restore GTK 4 and WebKitGTK packages
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: trayapp-apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trayapp-apt-${{ runner.os }}-${{ runner.arch }}-
      - name: GTK 4 and WebKitGTK, which Wails builds on
        if: runner.os == 'Linux'
        id: gtk
        timeout-minutes: 25
        # A stalled download gives up early and tries again.
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" libgtk-4-dev libwebkitgtk-6.0-dev
      - name: tidy the package cache
        if: always() && runner.os == 'Linux' && steps.gtk.outcome != 'skipped'
        run: |
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
      - name: save GTK 4 and WebKitGTK packages
        if: always() && runner.os == 'Linux' && steps.gtk.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: trayapp-apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      # A Windows checkout gives go.sum CR LF line ends, which -diff reports.
      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - name: vet and test
        run: |
          go vet ./...
          go test ./...
      - name: build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go build -ldflags -H=windowsgui -o cbb-desktop.exe .
          else
            go build -o cbb-desktop .
          fi
      - name: the Linux archive carries the tray app, as at a release
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # Only the archive's layout is checked here: a stand-in for cbb,
          # which the build job builds and packs.
          printf '#!/bin/sh\n' >"$RUNNER_TEMP/cbb"
          chmod 0755 "$RUNNER_TEMP/cbb"
          cp apps/desktop/cbb-desktop "$RUNNER_TEMP/cbb-desktop"
          sh packaging/archive.sh "$RUNNER_TEMP/cbb" linux amd64 "$RUNNER_TEMP/dist"
          tar -tzf "$RUNNER_TEMP/dist/cbb-linux-amd64.tar.gz" >"$RUNNER_TEMP/list"
          for f in cbb cbb-desktop packaging/linux/cbb.png packaging/linux/cbb.desktop packaging/linux/cbb-tray.desktop; do
            grep -qx "cbb/$f" "$RUNNER_TEMP/list"
          done
          # This runner has GTK 4 and WebKitGTK, which install.sh looks for.
          ! ldd "$RUNNER_TEMP/cbb-desktop" | grep 'not found'

  android:
    name: Android app
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle from the cache
        id: gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle, its download tried three times when it is not in the cache
        if: steps.gradle.outputs.cache-hit != 'true'
        working-directory: apps/android
        run: for _ in 1 2 3; do ./gradlew --no-daemon -q --version >/dev/null && exit 0; sleep 30; done; exit 1
      - name: the protocol core's tests
        working-directory: apps/android
        # The kit writes what it signs for the Go tests, as the Swift kit does.
        run: CBB_INTEROP_OUT="$GITHUB_WORKSPACE/interop-out" ./gradlew --no-daemon -p kit test jacocoTestReport
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-kotlin-kit
          path: apps/android/kit/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go reads what the Kotlin kit signed
        run: CBB_INTEROP_OUT="$PWD/interop-out" go test ./internal/group -run 'TestSwiftRecords|TestSwiftRenewal|TestSwiftAdmin|TestSwiftRoot|TestSwiftComputerAdmin|TestSwiftCommand' -v
      - name: the Kotlin kit pairs both ways with the computers' cbb and syncs with it over TLS
        # The Kotlin twin of cbb-interop plays the phone; Conscrypt
        # gives it TLS 1.3 on Linux as on Android.
        run: |
          (cd apps/android && ./gradlew --no-daemon -p kit interopScript)
          tool="$PWD/apps/android/kit/build/interop/cbb-interop"
          # The computer is the Rust cbb, with cbb-helper beside it.
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release -p cbb-member
          go build -o target/release/cbb-helper ./cmd/cbb-helper
          CBB_TEST_RUST_SERVICE="$PWD/target/release/cbb" CBB_SWIFT_INTEROP_TLS="$tool" go test -timeout 5m ./internal/service -run 'TestSwift' -v
      - name: the NDK the core is built with
        working-directory: apps/android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n "s/^cbb.ndk=//p" gradle.properties)" >/dev/null </dev/null'
      - name: the Rust the core is built with, and cargo-ndk
        working-directory: apps/android
        run: |
          rustup toolchain install "$(sed -n 's/^cbb.rust=//p' gradle.properties)" --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cargo install --locked cargo-ndk@4.1.2
      - name: build both builds of the app and the Wear OS app, and run their unit tests
        working-directory: apps/android
        # The runner image has the Android SDK; Gradle fetches a missing platform. The app
        # has two builds, full and fdroid (docs/apps.md, "F-Droid").
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease \
            :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest :app:lintFullDebug :app:lintFdroidDebug \
            :shared:testDebugUnitTest :shared:lintDebug :wear:assembleDebug :wear:assembleRelease :wear:lintDebug
      - name: the Android apps' software bill of materials, as the release makes it (tools/sbom)
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon --no-configuration-cache --init-script ../../packaging/sbom.init.gradle.kts \
            -Pcbb.sbom.configs=fullReleaseRuntimeClasspath,fdroidReleaseRuntimeClasspath,releaseRuntimeClasspath :app:cbbSbom :wear:cbbSbom
          cd ../..
          go run ./tools/sbom gradle -o "$RUNNER_TEMP/sbom-android.cdx.json" -version v0.0.0 apps/android/build/sbom/*.txt
          jq -e 'any(.components[]; .group == "androidx.core")' "$RUNNER_TEMP/sbom-android.cdx.json" >/dev/null
      - name: the F-Droid build has no Google Play services
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon -q :app:dependencies --configuration fdroidReleaseRuntimeClasspath > fdroid-deps.txt
          if grep -E 'com\.google\.(android\.gms|firebase|android\.play)|play-services' fdroid-deps.txt; then
            echo "The F-Droid build must not carry these."
            exit 1
          fi

  androidemu:
    name: Android app on an emulator
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the NDK the core is built with
        working-directory: apps/android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n "s/^cbb.ndk=//p" gradle.properties)" >/dev/null </dev/null'
      - name: the Rust the core is built with, and cargo-ndk
        working-directory: apps/android
        run: |
          rustup toolchain install "$(sed -n 's/^cbb.rust=//p' gradle.properties)" --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cargo install --locked cargo-ndk@4.1.2
      - name: the fleet's cbb, and cbb-helper, cbb-forward and cbb-relay beside it
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release -p cbb-member
          mkdir -p "$RUNNER_TEMP/fleet"
          cp target/release/cbb target/release/cbb-relay "$RUNNER_TEMP/fleet/"
          for p in cbb-helper cbb-forward; do
            CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fleet/$p" "./cmd/$p"
          done
      - name: an emulator, with KVM
        # The runner has KVM for its user once udev lets it.
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-35;google_apis;x86_64"
          "$sdk/sdkmanager" --install emulator platform-tools "$image" >/dev/null </dev/null
          # avdmanager and the emulator look for AVDs in different places
          # by default; one folder for both.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd -n bench -k "$image" -d pixel_6 -p "$ANDROID_AVD_HOME/bench.avd"
          [ -f "$ANDROID_AVD_HOME/bench.ini" ] || { ls -la "$ANDROID_AVD_HOME" ~/.android ~/.android/avd 2>&1; exit 1; }
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/emulator/emulator" -avd bench -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -accel on -gpu swiftshader_indirect -camera-back emulated -camera-front none >"$RUNNER_TEMP/emulator.log" 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          # An emulator that does not start says why in its log.
          timeout 300 "$adb" wait-for-device || { tail -100 "$RUNNER_TEMP/emulator.log"; exit 1; }
          for _ in $(seq 120); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 "$RUNNER_TEMP/emulator.log"; exit 1; }
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$s" 0
          done
          # The emulator has a mobile network beside its Wi-Fi, and the
          # default network can stay on it, while the tests that make the
          # phone's network home (c1_phoneHub) need the Wi-Fi. Mobile data
          # goes off in the emulated modem and in Android; right after boot
          # telephony can drop the request, so it is asked again until the
          # Wi-Fi carries the default route, with the Wi-Fi turned off and
          # on once halfway. With no network at all, the Wi-Fi is asked
          # to join the emulator's access point. Every 10 tries it prints
          # the route and the Wi-Fi's state, so a suite that stops here
          # shows how the phone's networks went.
          wifi_default() { "$adb" shell ip route get 8.8.8.8 2>/dev/null | grep -q 'dev wlan0'; }
          wifi_state() {
            "$adb" shell ip route get 8.8.8.8 2>&1 || true
            "$adb" shell cmd wifi status 2>&1 | head -5 || true
          }
          for i in $(seq 60); do
            "$adb" emu gsm data off >/dev/null 2>&1 || true
            "$adb" shell svc data disable || true
            wifi_default && break
            if ! "$adb" shell ip route get 8.8.8.8 >/dev/null 2>&1; then
              "$adb" shell cmd wifi connect-network AndroidWifi open >/dev/null 2>&1 || true
            fi
            if [ $((i % 10)) = 0 ]; then
              echo "try $i:"
              wifi_state
            fi
            if [ "$i" = 30 ]; then
              "$adb" shell svc wifi disable || true
              sleep 2
              "$adb" shell svc wifi enable || true
            fi
            sleep 2
          done
          if wifi_default; then
            echo "the emulator's default network is its Wi-Fi after $i tries"
          else
            wifi_state
            "$adb" shell ip addr 2>&1 | grep -E '^[0-9]+:|inet ' || true
            "$adb" shell settings get global airplane_mode_on || true
            "$adb" shell dumpsys connectivity | grep -E 'Active default network|NetworkAgentInfo\{' | cut -c1-400 || true
            "$adb" shell dumpsys wifi | grep -E 'Wi-Fi is|mWifiInfo|SupplicantState' | head -10 | cut -c1-400 || true
            echo "::error::the emulator's default network is not its Wi-Fi"
            exit 1
          fi
      - name: the phone suite
        run: go run ./tools/bench -cbb "$RUNNER_TEMP/fleet/cbb" -android apps/android -report "$RUNNER_TEMP/phone" phone
      - name: the emulator's log
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          tail -100 "$RUNNER_TEMP/emulator.log" || true
          # What the instrumented tests reported, and why a run ended early.
          results=apps/android/app/build/outputs/androidTest-results
          find "$results" -type f 2>/dev/null | head -50
          find "$results" -name '*.xml' -exec cat {} + 2>/dev/null | head -400
          # logcat waits for a device that never came up; the timeout ends that.
          timeout 30 "$ANDROID_HOME/platform-tools/adb" logcat -d -s TestRunner:* AndroidRuntime:* cbb:* GoLog:* System.err:* || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phone-report
          path: |
            ${{ runner.temp }}/phone
            apps/android/app/build/reports/androidTests
            apps/android/app/build/outputs/androidTest-results
          retention-days: 7

  fdroid:
    name: F-Droid build reproduces
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # F-Droid builds the fdroid APK from the tag and publishes ours only when its build is
    # the same, byte for byte, apart from the signature (docs/apps.md, "F-Droid"). Two builds
    # in different directories, users' time zones and umasks must give the same APK.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: one
      - name: the NDK the core is built with
        working-directory: one/apps/android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n "s/^cbb.ndk=//p" gradle.properties)" >/dev/null </dev/null'
      - name: the Rust the core is built with, and cargo-ndk
        working-directory: one/apps/android
        run: |
          rustup toolchain install "$(sed -n 's/^cbb.rust=//p' gradle.properties)" --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cargo install --locked cargo-ndk@4.1.2
      - name: Gradle from the cache
        id: gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('one/apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle, its download tried three times when it is not in the cache
        if: steps.gradle.outputs.cache-hit != 'true'
        working-directory: one/apps/android
        run: for _ in 1 2 3; do ./gradlew --no-daemon -q --version >/dev/null && exit 0; sleep 30; done; exit 1
      - name: build twice and compare
        run: sh one/packaging/fdroid/reproduce.sh "$PWD/one" "$RUNNER_TEMP/elsewhere/cbb"

  rustmips:
    name: cbb for MIPS (no tunnel)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # qemu-user from its release source, checked against this hash. Up to
      # 10.2.2 (Ubuntu 26.04 has 10.2.1) qemu leaves the last attribute of a
      # netlink message in the host's byte order when it is exactly 4 bytes
      # long, and the runner's kernel ends every link message with one (an
      # empty IFLA_DPLL_PIN); a big-endian guest's musl getifaddrs then walks
      # past its buffer and hangs or crashes. qemu fixed it in commit
      # 029f10e85278 (issue 2485; 10.2.3 and 11.1 carry it). The build (mips
      # and mipsel only) is cached.
      QEMU: "11.1.3"
      QEMU_SHA256: 5a8289c7940dc77d3873c81a6c29ba3afe1446fc9d36e77fa1658cdbecb84b22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly Rust with the standard library's source, and zig
        run: |
          rustup toolchain install nightly-2026-10-26 --profile minimal --component rust-src
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install -q ziglang==0.16.0 cargo-zigbuild==0.24.0
          echo "$RUNNER_TEMP/zig/bin" >>"$GITHUB_PATH"
      - name: qemu from the cache
        id: qemu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qemu
          key: qemu-${{ env.QEMU }}-mips-linux-user-${{ runner.os }}-${{ env.ImageOS }}
      - name: qemu from its source
        if: steps.qemu.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libglib2.0-dev python3-venv
          curl -fsSL --retry 3 -o qemu.tar.xz "https://download.qemu.org/qemu-$QEMU.tar.xz"
          echo "$QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          tar xJf qemu.tar.xz
          cd "qemu-$QEMU"
          ./configure --python=/usr/bin/python3 --target-list=mips-linux-user,mipsel-linux-user --disable-tools --disable-docs --prefix="$RUNNER_TEMP/qemu"
          ninja -C build qemu-mips qemu-mipsel
          mkdir -p "$RUNNER_TEMP/qemu/bin"
          cp build/qemu-mips build/qemu-mipsel "$RUNNER_TEMP/qemu/bin/"
      - name: qemu's netlink for a big-endian guest
        # A static musl program that lists the interfaces with getifaddrs
        # must finish under qemu-mips.
        run: |
          printf '#include <ifaddrs.h>\n#include <stdio.h>\nint main(void){struct ifaddrs *a; if (getifaddrs(&a)) return 1; for (struct ifaddrs *p = a; p; p = p->ifa_next) puts(p->ifa_name); return 0;}\n' >"$RUNNER_TEMP/ifaddrs.c"
          python3 -m ziglang cc -target mips-linux-musleabi -msoft-float -static -o "$RUNNER_TEMP/ifaddrs" "$RUNNER_TEMP/ifaddrs.c"
          timeout 60 "$RUNNER_TEMP/qemu/bin/qemu-mips" "$RUNNER_TEMP/ifaddrs"
      - name: build for mips and mipsel
        run: |
          sh member/packaging/mips.sh mips
          sh member/packaging/mips.sh mipsel
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the computers' cbb, and cbb-helper beside it
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release -p cbb-member
          go build -o target/release/cbb-helper ./cmd/cbb-helper
      - name: the MIPS builds under qemu with computers, all but sync away from home
        # The hubs' and the invitations' tests need the tunnel, which the
        # MIPS build leaves out.
        env:
          CBB_TEST_RUST_SERVICE: ${{ github.workspace }}/target/release/cbb
        run: |
          for a in mips mipsel; do
            skip='TestAloneMemberAway|TestAloneHub|TestAloneForwardOnly|TestAloneRelay|TestAloneInvite|TestAloneJoinInvite'
            q="$RUNNER_TEMP/qemu/bin/qemu-$a"
            printf '#!/bin/sh\nexec %s %s "$@"\n' "$q" "$PWD/target/$a-unknown-linux-musl/release/cbb" >"$RUNNER_TEMP/cbb-$a"
            chmod +x "$RUNNER_TEMP/cbb-$a"
            "$RUNNER_TEMP/cbb-$a" version | grep -q 'linux/mips'
            CBB_TEST_ALONE="$RUNNER_TEMP/cbb-$a" go test ./internal/service -run 'TestAlone' -skip "$skip" -v
          done

  # The service's tests (internal/service) against the Rust service that
  # every release ships: each member is a Rust cbb with cbb-helper beside
  # it, a phone is phone-on-linux, and they find each other by mDNS.
  service:
    name: service tests on the Rust cbb
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the Rust toolchain, swtpm for the keys in a TPM, and Xvfb for an X11 session's clipboard
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends swtpm xvfb xclip
      # The service's coverage (rust-service, docs/testing.md "Coverage"):
      # every Rust program below is built with instrument-coverage, so the
      # Rust cbb's own tests and the Go tests that run it add up.
      - name: cargo-llvm-cov, and the instrumented build's environment for the steps after
        run: |
          cargo install --locked cargo-llvm-cov@0.9.1
          # Without the shell's quotes, which $GITHUB_ENV would keep.
          cargo llvm-cov show-env | sed "s/='\(.*\)'\$/=\1/" >>"$GITHUB_ENV"
      - name: the Rust cbb's own tests, instrumented
        run: cargo test --locked --release -p cbb-member
      - name: the Rust cbb, cbb-helper beside it, and the phone's member on Linux
        run: |
          cargo build --locked --release -p cbb-member
          cargo build --locked --release -p cbb-ffi --features member,tunnel --example phone-on-linux
          cargo build --locked --release -p cbb-ffi --features tunnel --example tunnel-on-linux
          # Built with -cover: the Go side's coverage (cover-go-service.out)
          # counts what the helper does under these tests too.
          CGO_ENABLED=0 go build -trimpath -cover -coverpkg=./cmd/...,./internal/... -o target/release/cbb-helper ./cmd/cbb-helper
      # Each Go package runs as a test binary built with -cover, with
      # GOCOVERDIR for it and the helpers it starts; one package at a
      # time, so that -test.v streams each test's lines as it runs and a
      # test that hangs is named by the timeout's goroutine dump before the
      # job's own limit.
      - name: go test ./internal/service and the desktop connector with every Linux member a Rust cbb
        run: |
          Xvfb :5 -screen 0 640x480x24 -noreset >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 100); do [ -e /tmp/.X11-unix/X5 ] && break; sleep 0.1; done
          export GOCOVERDIR="$RUNNER_TEMP/go-cover"
          mkdir -p "$GOCOVERDIR"
          go test -c -cover -coverpkg=./cmd/...,./internal/... -o "$RUNNER_TEMP/service.test" ./internal/service
          go test -c -cover -coverpkg=./cmd/...,./internal/... -o "$RUNNER_TEMP/connector.test" ./internal/connector
          (cd internal/service && DISPLAY=:5 CBB_TEST_X11=1 \
            CBB_TEST_RUST_SERVICE="$GITHUB_WORKSPACE/target/release/cbb" CBB_TEST_ALONE="$GITHUB_WORKSPACE/target/release/cbb" \
            CBB_PHONE_ON_LINUX="$GITHUB_WORKSPACE/target/release/examples/phone-on-linux" \
            "$RUNNER_TEMP/service.test" -test.timeout 45m -test.v)
          (cd internal/connector && DISPLAY=:5 CBB_TEST_X11=1 \
            CBB_TEST_RUST_SERVICE="$GITHUB_WORKSPACE/target/release/cbb" CBB_TEST_ALONE="$GITHUB_WORKSPACE/target/release/cbb" \
            "$RUNNER_TEMP/connector.test" -test.timeout 5m -test.v)
      # The relay and the phones' tunnel, which the rust job checks from
      # outside, count here too: their Go tests run the same instrumented
      # build.
      - name: the relay and the phones' tunnel, from Go's side, for the coverage
        run: |
          export GOCOVERDIR="$RUNNER_TEMP/go-cover"
          go test -c -cover -coverpkg=./cmd/...,./internal/... -o "$RUNNER_TEMP/relay.test" ./internal/relay
          go test -c -cover -coverpkg=./cmd/...,./internal/... -o "$RUNNER_TEMP/tunnel.test" ./internal/tunnel
          (cd internal/relay && CBB_TEST_RUST_RELAY="$GITHUB_WORKSPACE/target/release/cbb-relay" \
            "$RUNNER_TEMP/relay.test" -test.timeout 10m -test.v)
          (cd internal/tunnel && CBB_TUNNEL_ON_LINUX="$GITHUB_WORKSPACE/target/release/examples/tunnel-on-linux" \
            CBB_TEST_RUST_RELAY="$GITHUB_WORKSPACE/target/release/cbb-relay" \
            "$RUNNER_TEMP/tunnel.test" -test.run TestRustPhone -test.timeout 15m -test.v)
      - name: a device of the previous release works in one group with this build (from 0.6 on; skips until 0.6.0 is out)
        run: |
          prev=$(sh tools/e2e/previous.sh "$RUNNER_TEMP/previous")
          CBB_PREVIOUS="$prev" CBB_TEST_RUST_SERVICE="$PWD/target/release/cbb" CBB_TEST_ALONE="$PWD/target/release/cbb" \
            go test -timeout 5m ./internal/service -run '^TestPreviousRelease$' -v
      - name: the Rust service's coverage, from its own tests and Go's
        if: success() || failure()
        run: cargo llvm-cov report --release --json --summary-only --output-path "$GITHUB_WORKSPACE/coverage-rust-service.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: coverage-rust-service
          path: coverage-rust-service.json
      - name: the Go side's coverage under the same tests
        if: success() || failure()
        run: |
          [ -d "$RUNNER_TEMP/go-cover" ] || exit 0
          go tool covdata textfmt -i "$RUNNER_TEMP/go-cover" -o cover-go-service.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: coverage-go-service
          path: cover-go-service.out
          if-no-files-found: ignore

  rust:
    name: cbb (Rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Rust toolchain, a cross compiler for the Raspberry Pi, and swtpm for the key in a TPM
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview --target aarch64-unknown-linux-gnu,arm-unknown-linux-musleabihf,x86_64-pc-windows-gnu,aarch64-apple-darwin,x86_64-unknown-freebsd
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross swtpm xvfb xclip
          echo CBB_TPM_REQUIRED=1 >>"$GITHUB_ENV"
      - name: cargo check on the oldest Rust the crates declare (rust-version)
        # Every crate of the workspace declares 1.95; the lock file must build there.
        run: |
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check --locked --workspace
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p cbb-member --features benchtime --all-targets -- -D warnings # the bench's time-scaled build
          cargo clippy --locked -p cbb-embassy --features host --all-targets -- -D warnings
          cargo clippy --locked -p cbb-ffi --features member --all-targets -- -D warnings
          cargo clippy --locked -p cbb-ffi --features member,tunnel --all-targets -- -D warnings
          cargo clippy --locked -p cbb-ffi --features tunnel --all-targets -- -D warnings
      - name: cargo clippy for Windows, macOS and FreeBSD (the service builds there too)
        run: |
          for t in x86_64-pc-windows-gnu aarch64-apple-darwin x86_64-unknown-freebsd; do
            cargo clippy --locked -p cbb-member --target "$t" --all-targets -- -D warnings
          done
      - name: cargo-llvm-cov, for the tests' coverage
        run: cargo install --locked cargo-llvm-cov@0.9.1
      - name: cargo test (the interop vectors in testdata/interop too), with coverage
        run: cargo llvm-cov --locked --workspace --json --summary-only --output-path "$GITHUB_WORKSPACE/coverage-rust.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage-rust.json
          retention-days: 7
      - name: cargo build
        run: |
          cargo build --locked --release
          cargo build --locked --release -p cbb-embassy --features host
      - name: cargo build for the Raspberry Pi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu
      - name: cargo build for the Raspberry Pi Zero (ARMv6, static; see .cargo/config.toml)
        run: cargo build --locked --release --target arm-unknown-linux-musleabihf
      - name: the crates' licenses, as the release archives carry them
        run: sh member/packaging/notices.sh arm-unknown-linux-musleabihf | grep -q '^rustls '
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: get.sh --no-helper installs cbb alone from the archive with cbb-helper, and uninstall.sh removes it
        run: |
          rel="$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/full"
          cp target/release/cbb "$RUNNER_TEMP/full/cbb"
          go build -o "$RUNNER_TEMP/full/cbb-helper" ./cmd/cbb-helper
          sh packaging/archive.sh "$RUNNER_TEMP/full/cbb" linux amd64 "$rel"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          sudo CBB_VERIFY=skip CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-helper --no-firewall | tee "$RUNNER_TEMP/get.out"
          systemctl is-active cbb.service
          test ! -e /usr/local/bin/cbb-helper
          test -f /etc/systemd/system/cbb.service.d/small.conf
          for f in /etc/xdg/autostart/cbb-desktop.desktop /etc/systemd/user/cbb-agent.service; do
            if [ -e "$f" ]; then
              echo "install.sh left $f" >&2
              exit 1
            fi
          done
          # Both exit 1, which pipefail would take for the grep's answer.
          for _ in $(seq 20); do
            out=$(sudo cbb status 2>&1) || true
            case $out in *'Not in a group'*) break ;; esac
            sleep 0.5
          done
          echo "$out" | grep -q 'Not in a group'
          # This archive carries no forwarder: cbb forward says what it runs.
          out=$(sudo cbb forward -show-key 2>&1) || true
          echo "$out" | grep -q 'runs cbb-forward, which is not beside this cbb'
          # Installed without its helper, cbb stays so when install.sh runs
          # again from an archive with the helper.
          sudo CBB_FIREWALL=no CBB_PAIR=no sh packaging/linux/install.sh "$RUNNER_TEMP/full/cbb"
          test ! -e /usr/local/bin/cbb-helper
          sudo sh /usr/local/share/cbb/uninstall.sh --purge
          test ! -e /etc/systemd/system/cbb.service.d/small.conf
          # Installed with its helper, which may hold its keys, cbb does not
          # go on without it.
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh "$RUNNER_TEMP/full/cbb"
          test -x /usr/local/bin/cbb-helper
          test ! -e /etc/systemd/system/cbb.service.d/small.conf
          if sudo CBB_FIREWALL=no sh packaging/linux/install.sh --no-helper "$RUNNER_TEMP/full/cbb" 2>"$RUNNER_TEMP/err"; then
            echo "install.sh left out the helper of cbb installed with it" >&2
            exit 1
          fi
          grep -q 'with its helper' "$RUNNER_TEMP/err"
          test -x /usr/local/bin/cbb-helper
          sudo sh /usr/local/share/cbb/uninstall.sh --purge
          for f in /usr/local/bin/cbb /etc/systemd/system/cbb.service /usr/local/share/cbb /etc/cbb /var/lib/cbb; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
      - name: install.sh --rootless --no-helper runs cbb alone as the user, without the console or the reboot, and uninstall.sh removes it
        run: |
          rel="$RUNNER_TEMP/release"
          rm -rf "$RUNNER_TEMP/rootless"
          mkdir -p "$RUNNER_TEMP/rootless"
          tar -xzf "$rel/cbb-linux-amd64.tar.gz" -C "$RUNNER_TEMP/rootless"
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.2; done
          sh "$RUNNER_TEMP/rootless/cbb/packaging/linux/install.sh" --rootless --no-helper --auto-update off "$RUNNER_TEMP/rootless/cbb/cbb"
          systemctl --user is-active -q cbb.service
          test -S "$XDG_RUNTIME_DIR/cbb/control.sock"
          test ! -e /usr/local/bin/cbb
          test ! -e ~/.local/bin/cbb-helper
          test ! -e ~/.config/systemd/user/cbb-agent.service
          out=$(~/.local/bin/cbb status 2>&1) || true
          echo "$out" | grep -q 'Not in a group'
          if ~/.local/bin/cbb paste-receive on -console 2>"$RUNNER_TEMP/err"; then
            echo "a rootless cbb took the console" >&2
            exit 1
          fi
          grep -q 'without root' "$RUNNER_TEMP/err"
          sh ~/.local/share/cbb/uninstall.sh --purge
          for f in ~/.local/bin/cbb ~/.config/systemd/user/cbb.service ~/.local/share/cbb ~/.local/state/cbb; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
      - name: cbb update, of cbb without its helper, installs a newer signed release, puts the old one back, and sets the timer
        run: |
          for v in 0.6.0 0.6.1; do
            CBB_VERSION=$v cargo build --locked
            mkdir -p "$RUNNER_TEMP/alone-$v"
            cp target/debug/cbb "$RUNNER_TEMP/alone-$v/cbb"
          done
          sudo CBB_FIREWALL=no CBB_PAIR=no sh packaging/linux/install.sh --auto-update off "$RUNNER_TEMP/alone-0.6.0/cbb"
          test "$(sudo cbb update -auto)" = off
          rel="$RUNNER_TEMP/update"
          sh packaging/archive.sh "$RUNNER_TEMP/alone-0.6.1/cbb" linux amd64 "$rel"
          go run ./tools/release-sign drill -version 0.6.1 "$rel" "$RUNNER_TEMP/update.pem"
          # The pinned roots refuse the throwaway ones.
          if CBB_RELEASE_DIR="$rel" cbb update -check 2>"$RUNNER_TEMP/err"; then echo "cbb update took a release the pinned roots did not sign" >&2; exit 1; fi
          grep -q 'keys.json' "$RUNNER_TEMP/err"
          export CBB_RELEASE_DIR="$rel" CBB_RELEASE_ROOTS="$RUNNER_TEMP/update.pem"
          cbb update -check | grep -q '0.6.1 is available'
          sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY cbb update
          cbb version | grep -q '^cbb 0.6.1 '
          sudo --preserve-env=CBB_RELEASE_DIR,CBB_RELEASE_ROOTS,CBB_VERIFY cbb update | grep -q 'is the newest release'
          # 0.6.2, whose service never starts: 0.6.1 goes back.
          rel2="$RUNNER_TEMP/update2"
          mkdir -p "$RUNNER_TEMP/alone-0.6.2"
          cat >"$RUNNER_TEMP/alone-0.6.2/cbb" <<'EOF'
          #!/bin/sh
          case $1 in
          version) echo "cbb 0.6.2 (linux/x86_64)" ;;
          run) exit 1 ;;
          esac
          EOF
          chmod 0755 "$RUNNER_TEMP/alone-0.6.2/cbb"
          sh packaging/archive.sh "$RUNNER_TEMP/alone-0.6.2/cbb" linux amd64 "$rel2"
          go run ./tools/release-sign drill -version 0.6.2 "$rel2" "$RUNNER_TEMP/update2.pem"
          if sudo CBB_RELEASE_DIR="$rel2" CBB_RELEASE_ROOTS="$RUNNER_TEMP/update2.pem" cbb update 2>"$RUNNER_TEMP/err"; then
            echo "cbb update kept a release whose service does not start" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/err"
          grep -q '0.6.1 is back' "$RUNNER_TEMP/err"
          cbb version | grep -q '^cbb 0.6.1 '
          systemctl is-active -q cbb.service
          sudo grep -q '"0.6.2"' /var/lib/cbb-update/update.json
          sudo cbb update -auto on
          systemctl cat cbb-update.service | grep -qx 'ExecStart=/usr/local/bin/cbb update -timer'
          sudo cbb update -auto off
          test ! -e /etc/systemd/system/cbb-update.timer
          sudo cbb update -auto on
          sudo sh /usr/local/share/cbb/uninstall.sh --purge
          test ! -e /etc/systemd/system/cbb-update.timer
          test ! -e /var/lib/cbb-update
      - name: the ESP32's network code joins by the phone on Linux, over a TAP interface
        run: |
          sudo ip tuntap add name tap0 mode tap user "$USER"
          sudo ip addr add 192.168.69.1/24 dev tap0
          sudo ip link set tap0 up
          # The computer it joins is a cbb, with cbb-helper beside it.
          go build -o target/release/cbb-helper ./cmd/cbb-helper
          CBB_ESP32_ON_LINUX="$PWD/target/release/esp32-on-linux" CBB_TEST_RUST_SERVICE="$PWD/target/release/cbb" \
            go test -race ./internal/service -run TestEmbassyJoiner -v
      - name: the phones' Rust tunnel and hub through ffi/ work with the Go hub and clients (WireGuard, AmneziaWG, VLESS with XHTTP)
        run: |
          cargo test --locked -p cbb-ffi --features tunnel tunnel && cargo build --locked --release -p cbb-ffi --features tunnel --example tunnel-on-linux
          CBB_TUNNEL_ON_LINUX="$PWD/target/release/examples/tunnel-on-linux" CBB_TEST_RUST_RELAY="$PWD/target/release/cbb-relay" \
            go test -race ./internal/tunnel -run TestRustPhone -v
      - name: the relay in Rust, checked from outside by a device's side in Go
        run: CBB_TEST_RUST_RELAY="$PWD/target/release/cbb-relay" go test -race -count=1 ./internal/relay -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbb-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/cbb
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbb-linux-armv6
          path: target/arm-unknown-linux-musleabihf/release/cbb
          retention-days: 14

  esp32:
    name: the core on the ESP32
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Rust toolchain for Xtensa (the ESP32-S3) from esp-rs/rust-build,
      # what espup installs, fetched directly and checked against these hashes.
      ESP_RUST: 1.99.0.0
      ESP_RUST_SHA256: b11376cf28b43ad31bd264de6987f6f50b8008824dcb12e6a7212331da5a8ed7
      ESP_RUST_SRC_SHA256: 31cee3ac662c026437c895846cb093b5d8438c13aa6c5f8d561e22bf7f8be543
      # Espressif's QEMU (the ESP32-S3 machine) and espflash, which writes the
      # flash image, for the firmware's self-test.
      ESP_QEMU: esp-develop-9.2.2-20260417
      ESP_QEMU_SHA256: 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
      ESPFLASH: 4.6.0
      ESPFLASH_SHA256: c4fcfa32ddc3155608f003a230e6f3c184eff9641ec9cfa8eb54f1b515d403e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Rust toolchain for RISC-V
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target riscv32imac-unknown-none-elf
          rustup default stable
      - name: the core with TLS without an operating system, RISC-V (the ESP32-C6)
        run: |
          cargo clippy --locked -p cbb-core --features tls --target riscv32imac-unknown-none-elf -- -D warnings
          cargo build --locked -p cbb-core --release --target riscv32imac-unknown-none-elf
          cargo build --locked -p cbb-core --features tls --release --target riscv32imac-unknown-none-elf
      - name: the Rust toolchain for Xtensa
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/esp-rs/rust-build/releases/download/v$ESP_RUST"
          curl -fsSL --retry 3 -o rust.tar.xz "$base/rust-$ESP_RUST-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL --retry 3 -o rust-src.tar.xz "$base/rust-src-$ESP_RUST.tar.xz"
          echo "$ESP_RUST_SHA256  rust.tar.xz" | sha256sum -c -
          echo "$ESP_RUST_SRC_SHA256  rust-src.tar.xz" | sha256sum -c -
          tar xf rust.tar.xz
          tar xf rust-src.tar.xz
          ./rust-nightly-x86_64-unknown-linux-gnu/install.sh --destdir="$RUNNER_TEMP/esp" --prefix= --without=rust-docs-json-preview,rust-docs --disable-ldconfig
          ./rust-src-nightly/install.sh --destdir="$RUNNER_TEMP/esp" --prefix= --disable-ldconfig
          rustup toolchain link esp "$RUNNER_TEMP/esp"
      - name: the core with TLS without an operating system, Xtensa (the ESP32-S3)
        run: cargo +esp build --locked -Zbuild-std=core,alloc -p cbb-core --features tls --release --target xtensa-esp32s3-none-elf
      - name: the firmware for the Arduino Nano ESP32
        working-directory: esp32/
        run: |
          cargo +esp fmt --check
          cargo +esp clippy --locked --release -- -D warnings
          cargo +esp clippy --locked --release --features console-type -- -D warnings
          cargo +esp clippy --locked --release --no-default-features --features qemu -- -D warnings
          cargo +esp build --locked --release
      - name: Espressif's QEMU and espflash
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libslirp0 libsdl2-2.0-0 libpixman-1-0
          curl -fsSL --retry 3 -o qemu.tar.xz "https://github.com/espressif/qemu/releases/download/$ESP_QEMU/qemu-xtensa-softmmu-${ESP_QEMU//-/_}-x86_64-linux-gnu.tar.xz"
          echo "$ESP_QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          tar xf qemu.tar.xz
          curl -fsSL --retry 3 -o espflash.zip "https://github.com/esp-rs/espflash/releases/download/v$ESPFLASH/espflash-x86_64-unknown-linux-gnu.zip"
          echo "$ESPFLASH_SHA256  espflash.zip" | sha256sum -c -
          unzip -q espflash.zip
      - name: the firmware in QEMU (the console, settings kept across restarts, the TLS 1.3 self-test)
        working-directory: esp32/
        run: QEMU="$RUNNER_TEMP/qemu/bin/qemu-system-xtensa" ESPFLASH="$RUNNER_TEMP/espflash" ./qemu-test.sh

  zxnext:
    name: ZX Spectrum Next
    needs: changes
    if: needs.changes.outputs.zxnext == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # z88dk from its release source, checked against this hash; the build
      # (about 8 minutes, the ZX Next libraries only) is cached.
      Z88DK: "2.3"
      Z88DK_SHA256: e08887ef9344f8dbd9d669bb904e17c35290a316bb1fe8b02c1a45b0d291292f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: z88dk from the cache
        id: z88dk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/z88dk
          key: z88dk-${{ env.Z88DK }}-zxn-${{ runner.os }}
      - name: z88dk from its source
        if: steps.z88dk.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flex libxml2-dev libgmp-dev libboost-dev texinfo dos2unix
          curl -fsSL --retry 3 -o z88dk.tgz "https://github.com/z88dk/z88dk/releases/download/v$Z88DK/z88dk-src-$Z88DK.tgz"
          echo "$Z88DK_SHA256  z88dk.tgz" | sha256sum -c -
          tar xzf z88dk.tgz
          cd z88dk && ./build.sh -k -p zxn
          # Keep only what zcc needs: the libraries, headers, crt sources and m4 macros.
          find libsrc -name '*.o' -delete
          find src -mindepth 1 -maxdepth 1 ! -name m4 -exec rm -rf {} +
          rm -rf testsuite examples doc
      - name: the dot command
        working-directory: apps/zxnext
        run: |
          export PATH="$RUNNER_TEMP/z88dk/bin:$PATH" ZCCCFG="$RUNNER_TEMP/z88dk/lib/config"
          # PIBRIDGE stands in for the Pi's cbb, whose SHA-256 CBB carries.
          make PI_CBB=build/PIBRIDGE
          test -s build/CBB
          test -s build/PIBRIDGE
          test -s build/CBB.DRV
          test -s build/CBB.OVL
          # The overlay's SHA-256 inside CBB, written there by ovl.sh.
          grep -q "$(sha256sum <build/CBB.OVL | cut -c1-64)" build/CBB
          grep -q "PIN_PI_SHA256 \"$(sha256sum <build/PIBRIDGE | cut -c1-64)\"" build/pins.h
          grep -q "PIN_DRV_SHA256 \"$(sha256sum <build/CBB.DRV | cut -c1-64)\"" build/pins.h
      - name: the frame parser's tests on the host, and the driver's in an emulator
        working-directory: apps/zxnext
        run: |
          rustup toolchain install stable --profile minimal
          export PATH="$RUNNER_TEMP/z88dk/bin:$PATH" ZCCCFG="$RUNNER_TEMP/z88dk/lib/config"
          make test
      - name: the files for cbb.tools (packaging/zxnext/site.sh; PIBRIDGE stands in for the Pi's cbb)
        run: |
          sh packaging/zxnext/site.sh apps/zxnext/build apps/zxnext/build/PIBRIDGE "$RUNNER_TEMP/site"
          test "$(wc -l <"$RUNNER_TEMP/site/zxnext/LIST")" -eq 5
          gzip -dc "$RUNNER_TEMP/site/zxnext/cbb.gz" | cmp - apps/zxnext/build/PIBRIDGE
          grep -q "^cbb [0-9]* [0-9a-f]\{8\} $(sha256sum <apps/zxnext/build/PIBRIDGE | cut -c1-64)$" "$RUNNER_TEMP/site/zxnext/LIST"
          cmp "$RUNNER_TEMP/site/zxnext/CBB" apps/zxnext/build/CBB
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbb-zxnext-dot
          path: |
            apps/zxnext/build/CBB
            apps/zxnext/build/CBB.OVL
            apps/zxnext/build/PIBRIDGE
            apps/zxnext/build/CBB.DRV
          retention-days: 14

  silica:
    name: Aurora app (${{ matrix.system }})
    needs: changes
    if: needs.changes.outputs.silica == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One code, a package per system (apps/silica/packaging), each built in
        # its own SDK for every architecture it has; Aurora 4's SDK has armv7hl only.
        include:
          - { system: aurora5, archs: armv7hl aarch64 }
          - { system: aurora4, archs: armv7hl }
          - { system: sailfish, archs: armv7hl aarch64 }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: room for the Platform SDK
        # The SDK takes about 10 GB; the runner's preinstalled toolchains
        # that this job does not use make room for it.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: the Platform SDK's downloads from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/psdk/dl
          key: psdk-${{ matrix.system }}-${{ hashFiles('apps/silica/psdk.sh') }}
      - name: the RPMs, unsigned (apps/silica/ci.sh; the workflow aurora signs Aurora 5's)
        env:
          ARCHS: ${{ matrix.archs }}
          SYSTEM: ${{ matrix.system }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q p7zip-full imagemagick gcc-arm-linux-gnueabihf libc6-dev-armhf-cross gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup toolchain install stable --profile minimal
          rustup default stable
          apps/silica/ci.sh "$RUNNER_TEMP/psdk" "$ARCHS" "$RUNNER_TEMP/rpm"

  phonecore:
    name: phone core (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the Rust core's libraries for the phones
        # The runner images have the Android NDK and Xcode; cargo-ndk links
        # the Android libraries with the NDK. The apps' jobs build them too,
        # with the NDK and Rust the apps pin; this job follows the latest.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$TARGET" = android ]; then
            export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
            cargo install --locked cargo-ndk@4.1.2
          fi
          sh ffi/bind.sh "$TARGET" "$RUNNER_TEMP/phonecore"
          find "$RUNNER_TEMP/phonecore" -maxdepth 3 | sort

  advisories:
    name: advisories (Rust, Android, tray app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Gradle from the cache
        id: gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle, its download tried three times when it is not in the cache
        if: steps.gradle.outputs.cache-hit != 'true'
        working-directory: apps/android
        run: for _ in 1 2 3; do ./gradlew --no-daemon -q --version >/dev/null && exit 0; sleep 30; done; exit 1
      - name: the versions Gradle resolves
        working-directory: apps/android
        # The init script locks every configuration, so --write-locks writes each
        # project's gradle.lockfile for the scan. Only the release runtime classpaths
        # are resolved: they are what the APKs carry, while lint and the other build
        # tools (with their own Bouncy Castle and HttpClient) never reach a phone.
        # A dependency Gradle could not resolve would be missing from the lockfile,
        # so that fails the job.
        run: |
          init="$GITHUB_WORKSPACE/.github/gradle/lock-all.init.gradle.kts"
          release="--configuration releaseRuntimeClasspath"
          # The app's full build carries everything its fdroid build does, and more.
          # shellcheck disable=SC2086 # $release is two words on purpose
          ./gradlew --no-daemon -q --init-script "$init" --write-locks \
            :app:dependencies --configuration fullReleaseRuntimeClasspath \
            :shared:dependencies $release :wear:dependencies $release > deps.txt
          ./gradlew --no-daemon -q --init-script "$init" --write-locks \
            -p kit dependencies --configuration runtimeClasspath >> deps.txt
          if grep ' FAILED$' deps.txt; then
            echo "Gradle could not resolve these dependencies."
            exit 1
          fi
      - name: OSV-Scanner
        # govulncheck checks the service's Go module in the check job; this checks the
        # cbb's crates, the Android apps' libraries and the tray app's module.
        run: |
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 scan source \
            --config .github/osv-scanner.toml \
            -L Cargo.lock -L esp32/Cargo.lock -L apps/desktop/go.mod \
            -L apps/android/app/gradle.lockfile -L apps/android/shared/gradle.lockfile \
            -L apps/android/wear/gradle.lockfile -L apps/android/kit/gradle.lockfile
      - name: cargo-deny, the crates' licenses and sources
        # Every crate of cbb and of the ESP32 firmware under a license
        # deny.toml allows (all fit the AGPL-3.0), from crates.io or the pinned
        # esp-hal commit only.
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo deny --locked check licenses bans sources
          (cd esp32/ && cargo deny --locked --config ../deny.toml check licenses bans sources)

  docker:
    name: docker image
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: cbb and the Go programs beside it for each platform of the image
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          rustup toolchain install stable --profile minimal
          for name in amd64 arm64 armv7; do
            t=$name goarch=$name goarm=
            if [ "$name" = armv7 ]; then t=arm/7 goarch=arm goarm=7; fi
            mkdir -p "$RUNNER_TEMP/$name"
            rust=$(sh member/packaging/build.sh "linux/$t")
            cp "$rust/cbb" "$rust/cbb-relay" "$RUNNER_TEMP/$name/"
            for p in cbb-helper cbb-forward; do
              GOARCH=$goarch GOARM=$goarm go build -trimpath -o "$RUNNER_TEMP/$name/$p" "./cmd/$p"
            done
          done
      - name: the image for every platform
        run: |
          ctx="$RUNNER_TEMP/image"
          sh packaging/docker/context.sh "$ctx" amd64="$RUNNER_TEMP/amd64/cbb" arm64="$RUNNER_TEMP/arm64/cbb" armv7="$RUNNER_TEMP/armv7/cbb"
          docker build -t cbb:ci "$ctx"
          for p in linux/arm64 linux/arm/v7; do
            docker build --platform "$p" -t "cbb:ci-$(echo "$p" | tr / -)" "$ctx"
          done
          for f in packaging/docker/compose.*.yaml; do docker compose -f "$f" config -q; done
      - name: two containers pair and sync, and a forwarder starts
        run: sh tools/e2e/docker.sh cbb:ci

  website:
    name: website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: nginx -t of the site's nginx configuration
        run: sh .github/nginx-check.sh
      - name: build the website
        run: go run ./tools/site build
      # The tools are pinned by site/package-lock.json; the runner's Node and Chrome run them
      # (Lighthouse needs Node 22.19 or later).
      - name: install the checks
        working-directory: site
        run: node --version && npm ci --ignore-scripts --no-audit --no-fund
      - name: valid HTML
        working-directory: site
        run: npm run validate
      # The first Chrome on a fresh runner starts with cold disk and font
      # caches, and Lighthouse once scored the first page 0.65 for it; a
      # page loaded first warms them. Each page then runs three times and
      # the median counts, as Lighthouse advises for its variance
      # (tools/site/lighthouse.go).
      - name: warm up Chrome
        run: google-chrome --headless=new --no-sandbox --dump-dom "file://$PWD/site/out/en/index.html" > /dev/null
      - name: Lighthouse (performance, accessibility, SEO)
        working-directory: site
        run: npm run lighthouse
      - name: keep the Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: site/out-lighthouse
          if-no-files-found: ignore
          retention-days: 7

  # The four implementations read the same changed bodies and record sets
  # alike (docs/differential.md); the nightly workflow runs it with a fresh
  # seed and more cases.
  differential:
    name: differential (Go, Rust, Kotlin, Swift)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Gradle from the cache
        id: gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Gradle, its download tried three times when it is not in the cache
        if: steps.gradle.outputs.cache-hit != 'true'
        working-directory: apps/android
        run: for _ in 1 2 3; do ./gradlew --no-daemon -q --version >/dev/null && exit 0; sleep 30; done; exit 1
      - name: a corpus of the fixed seed, read by all four
        run: sh .github/differential.sh 1 20000 500 "$RUNNER_TEMP/differential"
      - name: the cases read differently
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential
          path: ${{ runner.temp }}/differential/failures.jsonl
          if-no-files-found: ignore

  model:
    name: model of the records' rules (Quint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the scenarios, and the promises over random runs
        # docs/model/claims.qnt: the rules for handing the group over as docs/records-v2.md
        # words them. The simulator runs in Node (the typescript backend), so nothing but
        # the Quint package is downloaded.
        run: |
          quint="npx --yes @informalsystems/quint@0.33.1"
          $quint test --backend=typescript docs/model/claims.qnt
          $quint run --backend=typescript --invariant=promises --max-steps=12 --max-samples=20000 docs/model/claims.qnt

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, check, website, test, gocover, coverage, build, buildmac, mips, freebsd, openwrt, avahi, e2e, upgrade, desktop, packaging, homebrew, windows, kit, app, macapp, trayapp, android, androidemu, fdroid, phonecore, service, rust, rustmips, esp32, zxnext, silica, advisories, docker, differential, model]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          # A job is skipped only for a part the pull request leaves alone, once
          # the changes job has said so; a job whose own needs failed is skipped
          # too, but that failure is counted here.
          FAILED: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "A required job did not pass."
            exit 1
          fi
