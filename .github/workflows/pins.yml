# SPDX-License-Identifier: AGPL-3.0-only
# Checks the tool versions written out by hand in the workflows and build
# scripts, and Xray-core's tag in go.mod, which Dependabot does not see
# (tools/pins): a pin behind a release that has been out for a week, one
# tool pinned at two versions, or a pinned nightly Rust older than 60 days
# fails the run, which mails the
# maintainer, as GitHub does for a scheduled workflow; nothing is written
# anywhere.
name: pins

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the pinned tools against their latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/pins
