# Vale's settings for the apps' strings: go run ./tools/strings -lint
# writes each language's strings to <language>.txt, a string a paragraph,
# and runs Vale on them with these settings (docs/apps.md, "Words in the
# apps"). styles/<language>/Terms.yml is made from apps/l10n/terms.json.
StylesPath = styles
MinAlertLevel = error

[*/en.txt]
BasedOnStyles = Cbb, en

[*/ru.txt]
BasedOnStyles = Cbb, ru

[*/{ar,es,he,hi,sw,zh}.txt]
BasedOnStyles = Cbb
